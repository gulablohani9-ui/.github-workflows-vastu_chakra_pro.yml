            Map<String, dynamic> calculateAstroEngine() {
              int y = dob.year;
              int m = dob.month;
              int d = dob.day;
              if (m <= 2) {
                y -= 1;
                m += 12;
              }
              int a = y ~/ 100;
              int b = 2 - a + (a ~/ 4);
              double jd = (365.25 * (y + 4716)).floor() + (30.6001 * (m + 1)).floor() + d + b - 1524.5;
              double decHours = birthTime.hour + (birthTime.minute / 60.0) - 5.5;
              jd += decHours / 24.0;

              double t = (jd - 2451545.0) / 36525.0;

              double l0 = 280.46646 + 36000.76983 * t;
              double mSun = 357.52911 + 35999.05029 * t;
              double sunTrueLng = (l0 + 1.914602 * math.sin(mSun * math.pi / 180.0)) % 360.0;
              if (sunTrueLng < 0) sunTrueLng += 360.0;

              double moonL = 218.3165 + 481267.8813 * t;
              double moonLng = (moonL + 6.289 * math.sin((134.963 + 477198.867 * t) * math.pi / 180.0)) % 360.0;
              if (moonLng < 0) moonLng += 360.0;

              double ayanamsha = 23.85 + (dob.year - 2000) * 0.01397;
              double nirayanaMoon = (moonLng - ayanamsha) % 360.0;
              if (nirayanaMoon < 0) nirayanaMoon += 360.0;

              double nirayanaSun = (sunTrueLng - ayanamsha) % 360.0;
              if (nirayanaSun < 0) nirayanaSun += 360.0;

              double gmst = (280.46061837 + 360.98564736629 * (jd - 2451545.0)) % 360.0;
