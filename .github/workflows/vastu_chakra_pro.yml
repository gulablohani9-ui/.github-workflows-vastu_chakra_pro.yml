            pw.Widget buildDynamicMapOverlay({
              required Uint8List? chakraAsset,
              required double degree,
              double size = 330,
              bool drawPlot = true,
            }) {
              return pw.Container(
                width: size,
                height: size,
                child: pw.Stack(
                  alignment: pw.Alignment.center,
                  children: [
                    if (mapImageBytes != null)
                      pw.Image(pw.MemoryImage(mapImageBytes!), width: size - 30, height: size - 30, fit: pw.BoxFit.contain),
                    
                    if (drawPlot && plotPoints.length >= 3)
                      pw.CustomPaint(
                        size: PdfPoint(size, size),
                        painter: (PdfGraphics canvas, PdfPoint sz) {
                          canvas.setColor(PdfColors.amber800);
                          canvas.setLineWidth(1.8);
                          double minX = plotPoints.map((p) => p.dx).reduce(math.min);
                          double maxX = plotPoints.map((p) => p.dx).reduce(math.max);
                          double minY = plotPoints.map((p) => p.dy).reduce(math.min);
                          double maxY = plotPoints.map((p) => p.dy).reduce(math.max);

                          double w = (maxX - minX);
                          double h = (maxY - minY);
                          if (w > 0 && h > 0) {
                            double scale = (size - 60) / math.max(w, h);
                            double offsetX = (size - w * scale) / 2;
                            double offsetY = (size - h * scale) / 2;

                            List<PdfPoint> poly = plotPoints.map((p) {
                              return PdfPoint(offsetX + (p.dx - minX) * scale, offsetY + (p.dy - minY) * scale);
                            }).toList();

                            canvas.moveTo(poly[0].x, poly[0].y);
                            for (int i = 1; i < poly.length; i++) {
                              canvas.lineTo(poly[i].x, poly[i].y);
                            }
                            canvas.closePath();
                            canvas.strokePath();
                          }
                        },
                      ),

                    if (chakraAsset != null)
                      pw.Opacity(
                        opacity: mapImageBytes != null ? 0.75 : 1.0,
                        child: pw.Transform.rotate(
                          angle: (degree) * (math.pi / 180.0),
                          child: pw.Image(pw.MemoryImage(chakraAsset), width: size, height: size, fit: pw.BoxFit.contain),
                        ),
                      ),
                    pw.Container(
                      width: 8,
                      height: 8,
                      decoration: const pw.BoxDecoration(shape: pw.BoxShape.circle, color: PdfColors.red800),
                    ),
                  ],
                ),
              );
            }

            // Page 10: 45 Devta Grid Overlay (Crisp Vector Grid + Brahmasthan + Devta coordinates)
            pw.Widget buildConcentric45DevtaPlate({
              required Uint8List? bgMap,
              required double degree,
            }) {
              return pw.Container(
                width: 350,
                height: 350,
                child: pw.Stack(
                  alignment: pw.Alignment.center,
                  children: [
                    if (bgMap != null)
                      pw.Image(pw.MemoryImage(bgMap), width: 310, height: 310, fit: pw.BoxFit.contain),

                    pw.Transform.rotate(
                      angle: (degree) * (math.pi / 180),
                      child: pw.Container(
                        width: 290,
                        height: 320,
                        child: pw.CustomPaint(
                          size: const PdfPoint(290, 320),
                          painter: (PdfGraphics canvas, PdfPoint size) {
                            double w = 290;
                            double h = 320;
                            double cx = w / 2;
                            double cy = h / 2;

                            canvas.setColor(PdfColors.brown800);
                            canvas.setLineWidth(1.2);
                            canvas.drawRect(5, 5, w - 10, h - 10);
                            canvas.strokePath();

                            double w77 = (w - 10) * 0.77;
                            double h77 = (h - 10) * 0.77;
                            canvas.drawRect(cx - w77 / 2, cy - h77 / 2, w77, h77);
                            canvas.strokePath();

                            double w33 = (w - 10) * 0.33;
                            double h33 = (h - 10) * 0.33;
                            canvas.setColor(PdfColors.red900);
                            canvas.setLineWidth(1.4);
                            canvas.drawRect(cx - w33 / 2, cy - h33 / 2, w33, h33);
                            canvas.strokePath();

                            canvas.setColor(PdfColors.brown600);
                            canvas.setLineWidth(0.85);

                            void drawRadial(double x1, double y1, double x2, double y2) {
                              canvas.drawLine(x1, y1, x2, y2);
                              canvas.strokePath();
                            }

                            for (int i = 1; i <= 6; i++) {
                              double px = 5 + ((w - 10) / 7) * i;
                              double bx = (cx - w33 / 2) + (w33 / 7) * i;
                              drawRadial(bx, cy - h33 / 2, px, 5);
                              drawRadial(bx, cy + h33 / 2, px, h - 5);
                            }
                            for (int i = 1; i <= 10; i++) {
                              double py = 5 + ((h - 10) / 11) * i;
                              double by = (cy - h33 / 2) + (h33 / 11) * i;
                              drawRadial(cx - w33 / 2, by, 5, py);
                              drawRadial(cx + w33 / 2, by, w - 5, py);
                            }

                            drawRadial(cx - w33 / 2, cy - h33 / 2, 5, 5);
                            drawRadial(cx + w33 / 2, cy - h33 / 2, w - 5, 5);
                            drawRadial(cx - w33 / 2, cy + h33 / 2, 5, h - 5);
                            drawRadial(cx + w33 / 2, cy + h33 / 2, w - 5, h - 5);
                          },
                        ),
                      ),
                    ),

                    pw.Container(
                      width: 8,
                      height: 8,
                      decoration: const pw.BoxDecoration(shape: pw.BoxShape.circle, color: PdfColors.red800),
                    ),
                    pw.Positioned(
