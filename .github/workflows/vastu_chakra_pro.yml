name: Build Glohani Vastu 37-Page Suite APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Generate Glohani Vastu Complete 37-Page Suite
        run: |
          rm -rf lib android
          flutter create --template=app --org=com.glohani.vastureport --project-name=glohani_vastu_pro . --overwrite
          
          cat << 'EOF' > pubspec.yaml
          name: glohani_vastu_pro
          description: Glohani Vastu Complete Dynamic 37-Page Evaluation Suite
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            image_picker: ^1.0.7
            path_provider: ^2.1.2
            share_plus: ^7.2.2
            pdf: ^3.10.7
            printing: ^5.11.1
            intl: ^0.19.0

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
            assets:
              - assets/images/
          EOF

          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'dart:math' as math;
          import 'dart:typed_data';
          import 'dart:ui' as ui;
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart' show rootBundle;
          import 'package:image_picker/image_picker.dart';
          import 'package:pdf/pdf.dart';
          import 'package:pdf/widgets.dart' as pw;
          import 'package:printing/printing.dart';
          import 'package:intl/intl.dart';

          void main() {
            runApp(const GlohaniVastuApp());
          }

          class GlohaniVastuApp extends StatelessWidget {
            const GlohaniVastuApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Glohani Vastu Pro',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF121212),
                  primaryColor: Colors.tealAccent,
                  colorScheme: const ColorScheme.dark(
                    primary: Colors.tealAccent,
                    surface: Color(0xFF1E1E1E),
                  ),
                ),
                home: const MainMasterDashboard(),
              );
            }
          }

          class PersonProfile {
            String role;
            String name;
            DateTime dob;
            TimeOfDay birthTime;
            String birthPlace;
            double lat;
            double lng;
            PersonProfile({
              required this.role,
              required this.name,
              required this.dob,
              required this.birthTime,
              required this.birthPlace,
              required this.lat,
              required this.lng,
            });

            String get formattedBirthTime {
              final h = birthTime.hour.toString().padLeft(2, '0');
              final m = birthTime.minute.toString().padLeft(2, '0');
              return "$h:$m:00";
            }

            int get ageYears {
              final now = DateTime.now();
              int y = now.year - dob.year;
              if (now.month < dob.month || (now.month == dob.month && now.day < dob.day)) {
                y--;
              }
              return y < 0 ? 0 : y;
            }

            int get mulank {
              int sum = dob.day;
              while (sum > 9) {
                sum = (sum % 10) + (sum ~/ 10);
              }
              return sum;
            }

            int get bhagyank {
              int sum = dob.day + dob.month + dob.year;
              while (sum > 9) {
                int s = 0;
                while (sum > 0) {
                  s += sum % 10;
                  sum ~/= 10;
                }
                sum = s;
              }
              return sum;
            }

            int get nameNumber {
              const table = {
                'A':1, 'I':1, 'J':1, 'Q':1, 'Y':1,
                'B':2, 'K':2, 'R':2,
                'C':3, 'G':3, 'L':3, 'S':3,
                'D':4, 'M':4, 'T':4,
                'E':5, 'H':5, 'N':5, 'X':5,
                'U':6, 'V':6, 'W':6,
                'O':7, 'Z':7,
                'F':8, 'P':8
              };
              int total = 0;
              for (int i = 0; i < name.length; i++) {
                String ch = name[i].toUpperCase();
                if (table.containsKey(ch)) {
                  total += table[ch]!;
                }
              }
              while (total > 9) {
                int s = 0;
                while (total > 0) {
                  s += total % 10;
                  total ~/= 10;
                }
                total = s;
              }
              return total == 0 ? 1 : total;
            }
          }

