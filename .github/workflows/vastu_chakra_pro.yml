                            ),
                          ),
                          Text('${widget.northDegree.toInt()}°', style: const TextStyle(fontWeight: FontWeight.bold)),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class RulerGridPainter extends CustomPainter {
            final double pixelsPerFoot;
            final int maxFeet;
            RulerGridPainter({required this.pixelsPerFoot, required this.maxFeet});

            @override
            void paint(Canvas canvas, Size size) {
              final gridPaint = Paint()..color = Colors.white12..strokeWidth = 0.8;
              final axisPaint = Paint()..color = Colors.tealAccent..strokeWidth = 1.6;

              double originX = 35.0;
              double originY = size.height - 35.0;

              canvas.drawLine(Offset(originX, 10), Offset(originX, originY), axisPaint);
              canvas.drawLine(Offset(originX, originY), Offset(size.width - 10, originY), axisPaint);

              int step = maxFeet <= 30 ? 5 : (maxFeet <= 60 ? 10 : 20);

              for (int ft = 0; ft <= maxFeet + 10; ft += step) {
                double px = originX + ft * pixelsPerFoot;
                if (px < size.width) {
                  canvas.drawLine(Offset(px, 10), Offset(px, originY), gridPaint);
                  TextPainter(
                    text: TextSpan(text: '$ft', style: const TextStyle(color: Colors.tealAccent, fontSize: 8.5, fontWeight: FontWeight.bold)),
                    textDirection: ui.TextDirection.ltr,
                  )..layout()..paint(canvas, Offset(px - 6, originY + 6));
                }

                double py = originY - ft * pixelsPerFoot;
                if (py > 10) {
                  canvas.drawLine(Offset(originX, py), Offset(size.width - 10, py), gridPaint);
                  TextPainter(
                    text: TextSpan(text: '$ft', style: const TextStyle(color: Colors.tealAccent, fontSize: 8.5, fontWeight: FontWeight.bold)),
                    textDirection: ui.TextDirection.ltr,
                  )..layout()..paint(canvas, Offset(originX - 24, py - 5));
                }
              }
            }

            @override
            bool shouldRepaint(covariant RulerGridPainter oldDelegate) =>
                oldDelegate.pixelsPerFoot != pixelsPerFoot || oldDelegate.maxFeet != maxFeet;
          }

          class InteractivePlotPainter extends CustomPainter {
            final List<Offset> points;
            final Offset? centroid;
            final double northDegree;

            InteractivePlotPainter({
              required this.points,
              required this.centroid,
              required this.northDegree,
            });

            @override
            void paint(Canvas canvas, Size size) {
              final borderPaint = Paint()..color = Colors.amberAccent..strokeWidth = 2.2..style = PaintingStyle.stroke;
              final fillPaint = Paint()..color = Colors.amber.withOpacity(0.18)..style = PaintingStyle.fill;
              final dotPaint = Paint()..color = Colors.redAccent;

              if (points.isNotEmpty) {
                Path path = Path()..moveTo(points[0].dx, points[0].dy);
                for (int i = 1; i < points.length; i++) {
                  path.lineTo(points[i].dx, points[i].dy);
                }
                if (points.length >= 3) {
                  path.close();
                  canvas.drawPath(path, fillPaint);
                  canvas.drawPath(path, borderPaint);
                }

                for (int i = 0; i < points.length; i++) {
                  canvas.drawCircle(points[i], 10, dotPaint);
                  canvas.drawCircle(points[i], 4, Paint()..color = Colors.white);
                }
              }

              if (centroid != null) {
                canvas.drawCircle(centroid!, 7, Paint()..color = Colors.tealAccent);
                double rad = (northDegree - 90) * (math.pi / 180);
                Offset arrowEnd = Offset(centroid!.dx + 65 * math.cos(rad), centroid!.dy + 65 * math.sin(rad));
                canvas.drawLine(centroid!, arrowEnd, Paint()..color = Colors.red..strokeWidth = 2.5);
              }
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }

          class ZonalAreaEditorScreen extends StatefulWidget {
            final MasterClientData client;
            final VoidCallback onUpdate;
            const ZonalAreaEditorScreen({super.key, required this.client, required this.onUpdate});

            @override
            State<ZonalAreaEditorScreen> createState() => _ZonalAreaEditorScreenState();
          }

          class _ZonalAreaEditorScreenState extends State<ZonalAreaEditorScreen> {
            final zonesOrder = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];

            Map<String, double> runExcelEngine() {
              double w = widget.client.plotWidth / 2.0;
              double l = widget.client.plotLength / 2.0;
              double wl2 = w * l / 2.0;
              double a = (w * w) / 2.0;
              double b = (l * l) / 2.0;
              double diag = math.atan(l / w) * 180.0 / math.pi;

              Map<String, double> areas = {};
              double currD = widget.client.northDegree + 11.25;

              for (String z in zonesOrder) {
                double d = currD % 360.0;
                if (d < 0) d += 360.0;
                double e = (d - 22.5) % 360.0;
                if (e < 0) e += 360.0;

                bool c1 = ((d <= diag || d >= 360.0 - diag) && (e <= diag || e >= 360.0 - diag)) ||
                    ((d <= (180.0 + diag) % 360.0 && d >= (180.0 - diag) % 360.0) && (e <= (180.0 + diag) % 360.0 && e >= (180.0 - diag) % 360.0));

                bool c2 = ((d <= (180.0 - diag) && d >= diag) && (e <= (180.0 - diag) && e >= diag)) ||
                    ((d <= (360.0 - diag) && d >= (180.0 + diag)) && (e <= (360.0 - diag) && e >= (180.0 + diag)));

                bool c3 = (e <= diag && d >= diag && d < 90.0) ||
                    (e <= (180.0 + diag) && e > 180.0 && d >= (180.0 + diag) && d < 270.0);

                bool c4 = (e <= (180.0 - diag) && e > 90.0 && d >= (180.0 - diag) && d < 180.0) ||
                    (e <= (360.0 - diag) && e > 270.0 && d >= (360.0 - diag) && d < 360.0);

                double dRad = d * math.pi / 180.0;
                double eRad = e * math.pi / 180.0;

                double mVal = a * math.tan(dRad) - a * math.tan(eRad);
                double nVal = b * math.tan((d - 90.0) * math.pi / 180.0) + b * math.tan((90.0 - e) * math.pi / 180.0);
                double oVal = wl2 - a * math.tan(eRad) + wl2 - b * math.tan((90.0 - d) * math.pi / 180.0);
                double pVal = wl2 - a * math.tan((180.0 - d) * math.pi / 180.0) + wl2 - b * math.tan((e - 90.0) * math.pi / 180.0);

                double areaVal = wl2;
                if (c1) areaVal = mVal.abs();
                else if (c2) areaVal = nVal.abs();
                else if (c3) areaVal = oVal.abs();
                else if (c4) areaVal = pVal.abs();

                areas[z] = widget.client.manualZonalStrength[z] ?? areaVal;
                currD = e;
              }
              return areas;
            }

            @override
            Widget build(BuildContext context) {
              final areas = runExcelEngine();
              double sumArea = areas.values.reduce((a, b) => a + b);
              double balance = sumArea / 16.0;
              double maxVal = areas.values.reduce(math.max);
              double minVal = areas.values.reduce(math.min);
              double upperBal = (maxVal - balance) / 2.0 + balance;
              double lowerBal = (balance - minVal) / 2.0 + minVal;

              return Scaffold(
                appBar: AppBar(title: const Text('Plot Size & Zonal Strength Table')),
                body: ListView(
                  padding: const EdgeInsets.all(12),
                  children: [
                    Card(
                      child: Padding(
                        padding: const EdgeInsets.all(12.0),
                        child: Column(
                          children: [
                            const Text('Calibrated Dimensions (From Screen / Edit Below)', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.tealAccent)),
                            const SizedBox(height: 10),
                            Row(
                              children: [
                                Expanded(
                                  child: TextFormField(
                                    key: ValueKey('width-${widget.client.plotWidth}'),
                                    initialValue: widget.client.plotWidth.toString(),
                                    decoration: const InputDecoration(labelText: 'Plot Width (ft)', border: OutlineInputBorder()),
                                    keyboardType: TextInputType.number,
                                    onChanged: (v) {
                                      widget.client.plotWidth = double.tryParse(v) ?? 18.0;
                                      widget.onUpdate();
                                      setState(() {});
                                    },
                                  ),
                                ),
                                const SizedBox(width: 10),
                                Expanded(
                                  child: TextFormField(
                                    key: ValueKey('length-${widget.client.plotLength}'),
                                    initialValue: widget.client.plotLength.toString(),
                                    decoration: const InputDecoration(labelText: 'Plot Length (ft)', border: OutlineInputBorder()),
                                    keyboardType: TextInputType.number,
                                    onChanged: (v) {
                                      widget.client.plotLength = double.tryParse(v) ?? 20.0;
                                      widget.onUpdate();
                                      setState(() {});
                                    },
                                  ),
                                ),
                              ],
                            ),
                            const SizedBox(height: 10),
                            Text('Balance: ${balance.toStringAsFixed(1)} sq.ft | Upper: ${upperBal.toStringAsFixed(1)} | Lower: ${lowerBal.toStringAsFixed(1)}',
                                style: const TextStyle(fontSize: 12, color: Colors.grey)),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 10),
                    const Text('16 Zones Area Breakdown (Calculated via Excel formula):', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.tealAccent)),
                    const SizedBox(height: 6),
                    ...zonesOrder.map((z) {
                      double val = areas[z]!;
                      Color statusColor = val < lowerBal ? Colors.redAccent : (val > upperBal ? Colors.orangeAccent : Colors.greenAccent);
                      return ListTile(
                        dense: true,
                        title: Text('$z Zone Area', style: TextStyle(fontWeight: FontWeight.bold, color: statusColor)),
                        subtitle: Text('Ratio: ${(val / balance).toStringAsFixed(2)} | Status: ${val < lowerBal ? "Cut (Depleted)" : (val > upperBal ? "Extended" : "Balanced")}'),
                        trailing: SizedBox(
                          width: 90,
                          child: TextFormField(
                            key: ValueKey('$z-${widget.client.plotWidth}-${widget.client.plotLength}'),
                            initialValue: val.toStringAsFixed(1),
                            keyboardType: TextInputType.number,
                            decoration: const InputDecoration(isDense: true, border: OutlineInputBorder()),
                            onChanged: (newV) {
                              double? num = double.tryParse(newV);
                              if (num != null) {
                                widget.client.manualZonalStrength[z] = num;
                                widget.onUpdate();
                                setState(() {});
                              }
                            },
                          ),
                        ),
                      );
                    }).toList(),
                  ],
                ),
              );
            }
          }

