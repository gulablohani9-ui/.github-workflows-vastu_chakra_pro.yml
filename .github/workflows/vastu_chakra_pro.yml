                                  pw.Container(height: 54, child: pw.Center(child: pw.Text('${client.bhagyank} (NE)', style: pw.TextStyle(fontSize: 12, fontWeight: pw.FontWeight.bold)))),
                                  pw.Container(height: 54, child: pw.Center(child: pw.Text('1 (N)', style: pw.TextStyle(fontSize: 12, fontWeight: pw.FontWeight.bold)))),
                                  pw.Container(height: 54, child: pw.Center(child: pw.Text('6 (NW)', style: const pw.TextStyle(fontSize: 10, color: PdfColors.grey600)))),
                                ]),
                              ],
                            ),
                          ),
                          pw.SizedBox(width: 20),
                          pw.Expanded(
                            child: pw.Column(
                              crossAxisAlignment: pw.CrossAxisAlignment.start,
                              children: [
                                pw.Text('Psychic Number (Mulank): ${client.mulank}', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 11)),
                                pw.Text('Destiny Number (Bhagyank): ${client.bhagyank}', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 11)),
                                pw.SizedBox(height: 6),
                                pw.Text('Favorable Numbers: 1, 3, 5, 9', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, color: PdfColors.teal)),
                                pw.SizedBox(height: 8),
                                pw.Text('Remedy: Place Brass or Earth elements in SW and Center to balance grid stability.'),
                              ],
                            ),
                          ),
                        ],
                      ),
                      pw.Spacer(),
                      buildFooter(),
                    ],
                  ),
                ),
              );

              // 27. ABOUT SERVICES & CONSULTANT PROFILE
              pdf.addPage(
                pw.Page(
                  pageFormat: format,
                  build: (pw.Context ctx) => pw.Column(
                    crossAxisAlignment: pw.CrossAxisAlignment.center,
                    mainAxisAlignment: pw.MainAxisAlignment.center,
                    children: [
                      pw.Text('Glohani Vastu Consultancy Services', style: pw.TextStyle(fontSize: 18, fontWeight: pw.FontWeight.bold, color: PdfColors.red800)),
                      pw.Text('World-class Scientific & Astro-Vastu Architectural Solutions', style: const pw.TextStyle(fontSize: 10, color: PdfColors.teal)),
                      pw.SizedBox(height: 20),
                      pw.Text('Services Offered:', style: pw.TextStyle(fontWeight: pw.FontWeight.bold)),
                      pw.Text('• Plot Selection & Energy Activation | Flat / Commercial Vastu\n• Non-Demolition Energy Rectification | Astro-Vastu Kundli Mapping\n• Factory & Industrial Layout Design | Numerology Remedial Alignment', textAlign: pw.TextAlign.center, style: const pw.TextStyle(fontSize: 9.5, height: 1.4)),
                      pw.SizedBox(height: 30),
                      pw.Text('Contact & Correspondence:', style: pw.TextStyle(fontWeight: pw.FontWeight.bold)),
                      pw.Text('Glohani Vastu Center, Budherhat Rd, Kolkata-700094\nPhone: +91-8777614891 | Email: info@glohanivastu.com', textAlign: pw.TextAlign.center, style: const pw.TextStyle(fontSize: 8.5, color: PdfColors.grey700)),
                    ],
                  ),
                ),
              );

              return pdf.save();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Exact Evaluation PDF Preview'), centerTitle: true),
                body: PdfPreview(
                  build: (format) => generateFullReport(format),
                  canChangeOrientation: false,
                  canChangePageFormat: false,
                ),
              );
            }
          }
          EOF

      - name: Force Update Android Manifest with Permissions
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.glohani.vastureport">
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
             <application
                  android:label="Glohani Vastu Pro"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        run: |
          mkdir -p artifact_dir
          cp build/app/outputs/flutter-apk/app-release.apk artifact_dir/Glohani-Vastu-Report-Pro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Glohani-Vastu-Report-Pro
          path: artifact_dir/Glohani-Vastu-Report-Pro.apk
