            pw.Widget buildLoShuExactBox(PersonProfile p) {
              String dobStr = "${p.dob.day}-${p.dob.month}-${p.dob.year}";
              List<String> digits = dobStr.replaceAll('-', '').split('');

              String getDigitsForCell(String numStr) {
                int count = digits.where((d) => d == numStr).length;
                if (count == 0) return 'X';
                return List.filled(count, numStr).join(', ');
              }

              pw.Widget buildGridCell(String nums, String dir) {
                bool isMissing = nums == 'X';
                return pw.Container(
                  height: 48,
                  decoration: pw.BoxDecoration(
                    border: pw.Border.all(color: PdfColors.grey500, width: 0.8),
                  ),
                  child: pw.Center(
                    child: pw.Column(
                      mainAxisAlignment: pw.MainAxisAlignment.center,
                      children: [
                        pw.Text(
                          nums,
                          style: pw.TextStyle(
                            fontSize: 11,
                            fontWeight: pw.FontWeight.bold,
                            color: isMissing ? PdfColors.deepOrange700 : PdfColors.brown800,
                          ),
                        ),
                        pw.Text(
                          dir,
                          style: pw.TextStyle(
                            fontSize: 7.5,
                            fontWeight: pw.FontWeight.bold,
                            color: PdfColors.teal800,
                          ),
                        ),
                      ],
                    ),
                  ),
                );
              }

              return pw.Container(
                width: 220,
                decoration: pw.BoxDecoration(
                  border: pw.Border.all(color: PdfColors.grey400, width: 1.2),
                  color: PdfColors.grey100,
                ),
                child: pw.Column(
                  children: [
                    pw.Padding(
                      padding: const pw.EdgeInsets.symmetric(vertical: 6),
                      child: pw.Column(
                        children: [
                          pw.Text('Name: ${p.name.toUpperCase()}', style: pw.TextStyle(fontSize: 9.5, fontWeight: pw.FontWeight.bold, color: PdfColors.red800)),
                          pw.SizedBox(height: 2),
                          pw.Text('D.O.B: $dobStr', style: pw.TextStyle(fontSize: 9, fontWeight: pw.FontWeight.bold, color: PdfColors.red800)),
                        ],
                      ),
                    ),
                    pw.Table(
                      border: pw.TableBorder.all(color: PdfColors.grey500, width: 0.8),
                      children: [
                        pw.TableRow(children: [
                          buildGridCell(getDigitsForCell('4'), 'SE'),
                          buildGridCell(getDigitsForCell('9'), 'S'),
                          buildGridCell(getDigitsForCell('2'), 'SW'),
                        ]),
                        pw.TableRow(children: [
                          buildGridCell(getDigitsForCell('3'), 'E'),
                          buildGridCell(getDigitsForCell('5'), 'CENTER'),
                          buildGridCell(getDigitsForCell('7'), 'W'),
                        ]),
                        pw.TableRow(children: [
                          buildGridCell(getDigitsForCell('8'), 'NE'),
                          buildGridCell(getDigitsForCell('1'), 'N'),
                          buildGridCell(getDigitsForCell('6'), 'NW'),
                        ]),
                      ],
                    ),
                  ],
                ),
              );
            }

            pw.Widget buildNumerologyReportPage(PersonProfile p) {
              int m = p.mulank;
              int b = p.bhagyank;
              int nameNum = p.nameNumber;

              const mulankFriends = {
                1: {'f': '2, 3, 9', 'e': '6, 8'},
                2: {'f': '1, 3', 'e': '4, 8, 9'},
                3: {'f': '1, 2, 9', 'e': '5, 6'},
                4: {'f': '1, 5, 6, 7', 'e': '4, 8, 9'},
                5: {'f': '1, 6', 'e': '2'},
                6: {'f': '3, 4, 5, 8, 9', 'e': '1, 2, 6, 7'},
                7: {'f': '1, 2, 4, 5', 'e': '3, 6, 7, 8, 9'},
                8: {'f': '2, 3, 5, 6', 'e': '1, 4, 7, 8, 9'},
                9: {'f': '1, 2, 3, 5', 'e': '4, 7'},
              };

              String mFriends = mulankFriends[m]?['f'] ?? '1, 2, 3, 5';
              String mEnemies = mulankFriends[m]?['e'] ?? '4, 7';
              String bFriends = mulankFriends[b]?['f'] ?? '3, 4, 5, 8, 9';
              String bEnemies = mulankFriends[b]?['e'] ?? '1, 2, 6, 7';

              Set<int> setMF = mFriends.split(',').map((s) => int.tryParse(s.trim()) ?? 0).toSet();
              Set<int> setBF = bFriends.split(',').map((s) => int.tryParse(s.trim()) ?? 0).toSet();
              List<int> commonList = setMF.intersection(setBF).where((v) => v > 0).toList()..sort();
              String commonStr = commonList.isEmpty ? '4, 5' : commonList.join(', ');

              pw.Widget buildCheckRow(String title, String value, {bool isTitleBold = false, PdfColor? valColor}) {
                return pw.Padding(
                  padding: const pw.EdgeInsets.symmetric(vertical: 2),
                  child: pw.Row(
                    crossAxisAlignment: pw.CrossAxisAlignment.start,
                    children: [
                      pw.Container(
                        width: 10,
                        height: 10,
                        margin: const pw.EdgeInsets.only(top: 2, right: 6),
                        decoration: const pw.BoxDecoration(shape: pw.BoxShape.circle, color: PdfColors.teal700),
                        child: pw.Center(
                          child: pw.Text('v', style: pw.TextStyle(fontSize: 6, color: PdfColors.white, fontWeight: pw.FontWeight.bold)),
                        ),
                      ),
                      pw.RichText(
                        text: pw.TextSpan(
                          text: title,
                          style: pw.TextStyle(fontSize: 8.5, fontWeight: isTitleBold ? pw.FontWeight.bold : pw.FontWeight.normal, color: PdfColors.black),
                          children: [
                            pw.TextSpan(
                              text: ' $value',
                              style: pw.TextStyle(fontSize: 8.5, fontWeight: pw.FontWeight.bold, color: valColor ?? PdfColors.black),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                );
              }

              return pw.Column(
                crossAxisAlignment: pw.CrossAxisAlignment.start,
                children: [
                  buildHeader('NUMEROLOGY & LO SHU GRID EVALUATION'),
                  pw.SizedBox(height: 10),
                  pw.Center(child: buildLoShuExactBox(p)),
                  pw.SizedBox(height: 12),
                  pw.Center(child: pw.Text('* Numerology *', style: pw.TextStyle(fontSize: 12, fontWeight: pw.FontWeight.bold, color: PdfColors.brown800))),
                  pw.SizedBox(height: 8),
                  pw.RichText(
                    text: pw.TextSpan(
                      text: 'Result for Name: ',
                      style: pw.TextStyle(fontSize: 9.5, fontWeight: pw.FontWeight.bold, color: PdfColors.black),
                      children: [
                        pw.TextSpan(text: p.name.toUpperCase(), style: pw.TextStyle(fontSize: 9.5, fontWeight: pw.FontWeight.bold, color: PdfColors.teal800)),
                      ],
                    ),
                  ),
                  pw.SizedBox(height: 3),
                  buildCheckRow('Name Number:', '$nameNum'),
                  pw.SizedBox(height: 6),
                  pw.RichText(
                    text: pw.TextSpan(
                      text: 'Results for Date of Birth: ',
                      style: pw.TextStyle(fontSize: 9.5, fontWeight: pw.FontWeight.bold, color: PdfColors.black),
                      children: [
                        pw.TextSpan(text: '${p.dob.day}/${p.dob.month}/${p.dob.year}', style: pw.TextStyle(fontSize: 9.5, fontWeight: pw.FontWeight.bold, color: PdfColors.teal800)),
                      ],
                    ),
                  ),
                  pw.SizedBox(height: 3),
                  buildCheckRow('Psychic Number (Mulank):', '$m'),
                  buildCheckRow('Destiny Number (Bhagyank):', '$b'),
                  pw.SizedBox(height: 6),
                  pw.Text('Mulank ($m) Friends and Enemies:', style: pw.TextStyle(fontSize: 9, fontWeight: pw.FontWeight.bold, color: PdfColors.black)),
                  pw.SizedBox(height: 2),
                  buildCheckRow('Friends:', mFriends),
                  buildCheckRow('Enemies:', mEnemies),
                  pw.SizedBox(height: 6),
                  pw.Text('Bhagyank ($b) Friends and Enemies:', style: pw.TextStyle(fontSize: 9, fontWeight: pw.FontWeight.bold, color: PdfColors.black)),
                  pw.SizedBox(height: 2),
                  buildCheckRow('Friends:', bFriends),
