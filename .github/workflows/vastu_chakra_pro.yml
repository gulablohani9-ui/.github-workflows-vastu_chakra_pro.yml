name: Build Vastu Chakra Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Generate Vastu Chakra Pro Multi-Window Suite
        run: |
          rm -rf lib android
          flutter create --template=app --org=com.astro.vastuchakra --project-name=vastu_chakra_pro . --overwrite
          
          cat << 'EOF' > pubspec.yaml
          name: vastu_chakra_pro
          description: Vastu Floor Plan Centroid, 16 Zones Bar Chart, 45 Devtas, and PDF Report Suite
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            image_picker: ^1.0.7
            screenshot: ^2.1.0
            path_provider: ^2.1.2
            share_plus: ^7.2.2
            pdf: ^3.10.7
            printing: ^5.11.1

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          EOF

          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'dart:math' as math;
          import 'dart:typed_data';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:screenshot/screenshot.dart';
          import 'package:share_plus/share_plus.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:pdf/pdf.dart';
          import 'package:pdf/widgets.dart' as pw;
          import 'package:printing/printing.dart';

          void main() {
            runApp(const VastuChakraApp());
          }

          class VastuChakraApp extends StatelessWidget {
            const VastuChakraApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Vastu Chakra Pro',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF121212),
                  primaryColor: Colors.amberAccent,
                  cardColor: const Color(0xFF1E1E1E),
                  colorScheme: const ColorScheme.dark(
                    primary: Colors.amberAccent,
                    surface: Color(0xFF1E1E1E),
                  ),
                ),
                home: const MainVastuContainer(),
              );
            }
          }

          class MainVastuContainer extends StatefulWidget {
            const MainVastuContainer({super.key});

            @override
            State<MainVastuContainer> createState() => _MainVastuContainerState();
          }

          class _MainVastuContainerState extends State<MainVastuContainer> {
            int _navIndex = 0;

            File? mapImage;
            List<Offset> points = [];
            int selectedDivision = 16;
            bool showDevtas = false;
            double northDegree = 0.0;
            final ScreenshotController screenshotController = ScreenshotController();

            Offset? calculateCentroid(List<Offset> pts) {
              if (pts.length < 3) return null;
              double area = 0.0;
              double cx = 0.0;
              double cy = 0.0;

              for (int i = 0; i < pts.length; i++) {
                int j = (i + 1) % pts.length;
                double factor = (pts[i].dx * pts[j].dy) - (pts[j].dx * pts[i].dy);
                area += factor;
                cx += (pts[i].dx + pts[j].dx) * factor;
                cy += (pts[i].dy + pts[j].dy) * factor;
              }
              area *= 0.5;
              if (area.abs() < 0.0001) return null;
              cx /= (6.0 * area);
              cy /= (6.0 * area);
              return Offset(cx, cy);
            }

            @override
            Widget build(BuildContext context) {
              Offset? centroid = calculateCentroid(points);

              final List<Widget> windows = [
                MapEditorWindow(
                  mapImage: mapImage,
                  points: points,
                  centroid: centroid,
                  selectedDivision: selectedDivision,
                  showDevtas: showDevtas,
                  northDegree: northDegree,
                  screenshotController: screenshotController,
                  onImageSelected: (img) => setState(() => mapImage = img),
                  onPointsUpdated: (pts) => setState(() => points = pts),
                  onDivisionChanged: (d) => setState(() => selectedDivision = d),
                  onDevtasToggled: (v) => setState(() => showDevtas = v),
                  onDegreeChanged: (deg) => setState(() => northDegree = deg),
                ),
                VastuBarChartWindow(
                  points: points,
                  centroid: centroid,
                  northDegree: northDegree,
                ),
                const DevtasReferenceWindow(),
                PdfExportWindow(
                  points: points,
                  centroid: centroid,
                  northDegree: northDegree,
                  selectedDivision: selectedDivision,
                  screenshotController: screenshotController,
                ),
              ];

              return Scaffold(
                body: windows[_navIndex],
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _navIndex,
                  selectedItemColor: Colors.amberAccent,
                  unselectedItemColor: Colors.grey,
                  backgroundColor: const Color(0xFF1A1A1A),
                  type: BottomNavigationBarType.fixed,
                  onTap: (idx) => setState(() => _navIndex = idx),
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.architecture), label: 'Map Editor'),
                    BottomNavigationBarItem(icon: Icon(Icons.bar_chart), label: 'Bar Chart'),
                    BottomNavigationBarItem(icon: Icon(Icons.temple_hindu), label: '45 Devtas'),
                    BottomNavigationBarItem(icon: Icon(Icons.picture_as_pdf), label: 'PDF Report'),
                  ],
                ),
              );
            }
          }

          // WINDOW 1: MAP EDITOR WITH DRAGGABLE/MODIFIABLE DOTS
          class MapEditorWindow extends StatefulWidget {
            final File? mapImage;
            final List<Offset> points;
            final Offset? centroid;
            final int selectedDivision;
            final bool showDevtas;
            final double northDegree;
            final ScreenshotController screenshotController;
            final Function(File) onImageSelected;
            final Function(List<Offset>) onPointsUpdated;
            final Function(int) onDivisionChanged;
            final Function(bool) onDevtasToggled;
            final Function(double) onDegreeChanged;

            const MapEditorWindow({
              super.key,
              required this.mapImage,
              required this.points,
              required this.centroid,
              required this.selectedDivision,
              required this.showDevtas,
              required this.northDegree,
              required this.screenshotController,
              required this.onImageSelected,
              required this.onPointsUpdated,
              required this.onDivisionChanged,
              required this.onDevtasToggled,
              required this.onDegreeChanged,
            });

            @override
            State<MapEditorWindow> createState() => _MapEditorWindowState();
          }

          class _MapEditorWindowState extends State<MapEditorWindow> {
            final ImagePicker _picker = ImagePicker();
            int? _draggedPointIndex;

            Future<void> _pickImage(ImageSource source) async {
              final picked = await _picker.pickImage(source: source);
              if (picked != null) {
                widget.onImageSelected(File(picked.path));
                widget.onPointsUpdated([]);
              }
            }

            int? _findNearestPoint(Offset touch) {
              for (int i = 0; i < widget.points.length; i++) {
                if ((widget.points[i] - touch).distance < 30.0) {
                  return i;
                }
              }
              return null;
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Interactive Vastu Map'),
                  centerTitle: true,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.delete_sweep, color: Colors.redAccent),
                      tooltip: 'Clear All Dots',
                      onPressed: () => widget.onPointsUpdated([]),
                    ),
                  ],
                ),
                body: Column(
                  children: [
                    Container(
                      color: const Color(0xFF1E1E1E),
                      padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          ElevatedButton.icon(
                            style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF2E2E2E), foregroundColor: Colors.amberAccent),
                            onPressed: () => _pickImage(ImageSource.gallery),
                            icon: const Icon(Icons.photo_library, size: 16),
                            label: const Text('Gallery'),
                          ),
                          ElevatedButton.icon(
                            style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF2E2E2E), foregroundColor: Colors.amberAccent),
                            onPressed: () => _pickImage(ImageSource.camera),
                            icon: const Icon(Icons.camera_alt, size: 16),
                            label: const Text('Camera'),
                          ),
                          if (widget.points.isNotEmpty)
                            TextButton.icon(
                              onPressed: () {
                                List<Offset> updated = List.from(widget.points);
                                updated.removeLast();
                                widget.onPointsUpdated(updated);
                              },
                              icon: const Icon(Icons.undo, color: Colors.orangeAccent, size: 16),
                              label: const Text('Undo Dot', style: TextStyle(color: Colors.orangeAccent)),
                            ),
                        ],
                      ),
                    ),
                    Expanded(
                      child: Screenshot(
                        controller: widget.screenshotController,
                        child: GestureDetector(
                          onPanDown: (details) {
                            int? found = _findNearestPoint(details.localPosition);
                            if (found != null) {
                              _draggedPointIndex = found;
                            } else {
                              List<Offset> updated = List.from(widget.points)..add(details.localPosition);
                              widget.onPointsUpdated(updated);
                            }
                          },
                          onPanUpdate: (details) {
                            if (_draggedPointIndex != null) {
                              List<Offset> updated = List.from(widget.points);
                              updated[_draggedPointIndex!] = details.localPosition;
                              widget.onPointsUpdated(updated);
                            }
                          },
                          onPanEnd: (_) => _draggedPointIndex = null,
                          child: Stack(
                            fit: StackFit.expand,
                            children: [
                              Container(
                                color: Colors.black,
                                child: widget.mapImage != null
                                    ? Image.file(widget.mapImage!, fit: BoxFit.contain)
                                    : const Center(
                                        child: Text(
                                          '1. Add Map Image\n2. Tap to place corner dots\n3. Touch & drag any dot to reposition/modify anytime',
                                          textAlign: TextAlign.center,
                                          style: TextStyle(color: Colors.grey, height: 1.5),
                                        ),
                                      ),
                              ),
                              CustomPaint(
                                painter: VastuPainter(
                                  points: widget.points,
                                  centroid: widget.centroid,
                                  division: widget.selectedDivision,
                                  showDevtas: widget.showDevtas,
                                  northDegree: widget.northDegree,
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                    _buildControls(),
                  ],
                ),
              );
            }

            Widget _buildControls() {
              return Container(
                color: const Color(0xFF1E1E1E),
                padding: const EdgeInsets.all(10),
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    Row(
                      children: [
                        const Text('North: ', style: TextStyle(color: Colors.amberAccent, fontWeight: FontWeight.bold)),
                        Expanded(
                          child: Slider(
                            value: widget.northDegree,
                            min: 0,
                            max: 360,
                            activeColor: Colors.amberAccent,
                            inactiveColor: Colors.grey,
                            onChanged: widget.onDegreeChanged,
                          ),
                        ),
                        Text('${widget.northDegree.toInt()}°', style: const TextStyle(fontWeight: FontWeight.bold)),
                      ],
                    ),
                    Row(
                      mainAxisAlignment: MainAxisAlignment.spaceBetween,
                      children: [
                        ToggleButtons(
                          isSelected: [
                            widget.selectedDivision == 4,
                            widget.selectedDivision == 8,
                            widget.selectedDivision == 16,
                            widget.selectedDivision == 32,
                          ],
                          onPressed: (idx) {
                            const divs = [4, 8, 16, 32];
                            widget.onDivisionChanged(divs[idx]);
                          },
                          color: Colors.white70,
                          selectedColor: Colors.black,
                          fillColor: Colors.amberAccent,
                          borderRadius: BorderRadius.circular(8),
                          children: const [
                            Padding(padding: EdgeInsets.symmetric(horizontal: 8), child: Text('4')),
                            Padding(padding: EdgeInsets.symmetric(horizontal: 8), child: Text('8')),
                            Padding(padding: EdgeInsets.symmetric(horizontal: 8), child: Text('16')),
                            Padding(padding: EdgeInsets.symmetric(horizontal: 8), child: Text('32')),
                          ],
                        ),
                        FilterChip(
                          label: const Text('45 Devtas Overlay', style: TextStyle(fontSize: 11)),
                          selected: widget.showDevtas,
                          selectedColor: Colors.orangeAccent,
                          onSelected: widget.onDevtasToggled,
                        ),
                      ],
                    ),
                    const SizedBox(height: 4),
                    Text(
                      widget.centroid != null ? 'Brahmasthan (Center Point) Locked | Drag dots to modify' : 'Tap 3 or more corners to form boundary',
                      style: TextStyle(color: widget.centroid != null ? Colors.greenAccent : Colors.amberAccent, fontSize: 11),
                    ),
                  ],
                ),
              );
            }
          }

          // WINDOW 2: 16 ZONES BAR CHART WINDOW
          class VastuBarChartWindow extends StatelessWidget {
            final List<Offset> points;
            final Offset? centroid;
            final double northDegree;

            const VastuBarChartWindow({
              super.key,
              required this.points,
              required this.centroid,
              required this.northDegree,
            });

            static const List<String> zones16 = [
              'N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE',
              'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'
            ];

            List<double> _calculateZoneStrengths() {
              if (centroid == null || points.length < 3) {
                return List.filled(16, 50.0);
              }

              List<double> strengths = List.filled(16, 0.0);
              double step = 360.0 / 16.0;
              double offsetRad = (northDegree - 90) * (math.pi / 180.0);

              for (int z = 0; z < 16; z++) {
                double zAngle = (z * step) * (math.pi / 180.0) + offsetRad;
                double minDist = 9999.0;

                for (var pt in points) {
                  double d = (pt - centroid!).distance;
                  double ptAngle = math.atan2(pt.dy - centroid!.dy, pt.dx - centroid!.dx);
                  double diff = (ptAngle - zAngle).abs() % (2 * math.pi);
                  if (diff > math.pi) diff = 2 * math.pi - diff;

                  if (diff < (step * math.pi / 180.0)) {
                    if (d < minDist) minDist = d;
                  }
                }
                strengths[z] = minDist == 9999.0 ? 40.0 : (minDist % 100).clamp(25.0, 95.0);
              }
              return strengths;
            }

            @override
            Widget build(BuildContext context) {
              List<double> heights = _calculateZoneStrengths();

              return Scaffold(
                appBar: AppBar(title: const Text('16 Zones Area Bar Chart'), centerTitle: true),
                body: Padding(
                  padding: const EdgeInsets.all(16.0),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      const Text(
                        '16 Vastu Zones Balancing (Cut & Extension Chart)',
                        style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.amberAccent),
                      ),
                      const SizedBox(height: 6),
                      const Text(
                        'Green: Balanced | Red: Cut Zone (<35%) | Orange: Extended Zone (>75%)',
                        style: TextStyle(fontSize: 12, color: Colors.grey),
                      ),
                      const SizedBox(height: 20),
                      Expanded(
                        child: Row(
                          crossAxisAlignment: CrossAxisAlignment.end,
                          children: List.generate(16, (i) {
                            double val = heights[i];
                            Color barColor = val < 35
                                ? Colors.redAccent
                                : (val > 75 ? Colors.orangeAccent : Colors.greenAccent);

                            return Expanded(
                              child: Column(
                                mainAxisAlignment: MainAxisAlignment.end,
                                children: [
                                  Text('${val.toInt()}%', style: TextStyle(fontSize: 9, color: barColor, fontWeight: FontWeight.bold)),
                                  const SizedBox(height: 4),
                                  Container(
                                    height: val * 2.5,
                                    margin: const EdgeInsets.symmetric(horizontal: 2),
                                    decoration: BoxDecoration(
                                      color: barColor,
                                      borderRadius: const BorderRadius.vertical(top: Radius.circular(4)),
                                    ),
                                  ),
                                  const SizedBox(height: 6),
                                  RotatedBox(
                                    quarterTurns: 3,
                                    child: Text(zones16[i], style: const TextStyle(fontSize: 10, fontWeight: FontWeight.bold)),
                                  ),
                                ],
                              ),
                            );
                          }),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          // WINDOW 3: 45 VASTU DEVTAS REFERENCE WINDOW
