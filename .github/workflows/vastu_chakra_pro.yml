name: Build Glohani Vastu 37-Page Suite APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Generate Glohani Vastu Master Suite
        run: |
          rm -rf lib android
          flutter create --template=app --org=com.glohani.vastureport --project-name=glohani_vastu_pro . --overwrite
          
          cat << 'EOF' > pubspec.yaml
          name: glohani_vastu_pro
          description: Glohani Vastu Exact 37-Page Professional Evaluation Suite
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            image_picker: ^1.0.7
            path_provider: ^2.1.2
            share_plus: ^7.2.2
            pdf: ^3.10.7
            printing: ^5.11.1
            intl: ^0.19.0

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
            assets:
              - assets/images/
          EOF

          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'dart:math' as math;
          import 'dart:typed_data';
          import 'dart:ui' as ui;
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart' show rootBundle;
          import 'package:image_picker/image_picker.dart';
          import 'package:pdf/pdf.dart';
          import 'package:pdf/widgets.dart' as pw;
          import 'package:printing/printing.dart';
          import 'package:intl/intl.dart';

          void main() {
            runApp(const GlohaniVastuApp());
          }

          class GlohaniVastuApp extends StatelessWidget {
            const GlohaniVastuApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Glohani Vastu Pro',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF121212),
                  primaryColor: Colors.tealAccent,
                  colorScheme: const ColorScheme.dark(
                    primary: Colors.tealAccent,
                    surface: Color(0xFF1E1E1E),
                  ),
                ),
                home: const MainMasterDashboard(),
              );
            }
          }

          class CityData {
            final String name;
            final double lat;
            final double lng;
            const CityData(this.name, this.lat, this.lng);
          }

          const List<CityData> kIndianCities = [
            CityData("Jalor, Rajasthan, India", 25.3444, 72.6156),
            CityData("Jodhpur, Rajasthan, India", 26.2389, 73.0243),
            CityData("Jaipur, Rajasthan, India", 26.9124, 75.7873),
            CityData("Udaipur, Rajasthan, India", 24.5854, 73.7125),
            CityData("Bikaner, Rajasthan, India", 28.0229, 73.3119),
            CityData("Ajmer, Rajasthan, India", 26.4499, 74.6399),
            CityData("Kota, Rajasthan, India", 25.2138, 75.8648),
            CityData("Pali, Rajasthan, India", 25.7711, 73.3234),
            CityData("Barmer, Rajasthan, India", 25.7521, 71.3967),
            CityData("Sirohi, Rajasthan, India", 24.8826, 72.8589),
            CityData("Nagaur, Rajasthan, India", 27.2070, 73.7423),
            CityData("Ahmedabad, Gujarat, India", 23.0225, 72.5714),
            CityData("Delhi, India", 28.7041, 77.1025),
            CityData("Mumbai, Maharashtra, India", 19.0760, 72.8777),
            CityData("Kolkata, West Bengal, India", 22.5726, 88.3639),
          ];

          class MasterClientData {
            String name = "Ghanshyam";
            String propertyType = "HOME";
            String address = "Jalor, Rajasthan, India";
            DateTime dob = DateTime(1983, 6, 30);
            TimeOfDay birthTime = const TimeOfDay(hour: 1, minute: 20);
            String birthPlace = "Jalor, Rajasthan, India";
            double latitude = 25.3444;
            double longitude = 72.6156;
            double northDegree = 254.0;
            double plotWidth = 18.0;
            double plotLength = 20.0;

            Map<String, double> manualZonalStrength = {};

            String get formattedBirthTime {
              final h = birthTime.hour.toString().padLeft(2, '0');
              final m = birthTime.minute.toString().padLeft(2, '0');
              return "$h:$m";
            }

            int get mulank {
              int sum = dob.day;
              while (sum > 9) {
                sum = (sum % 10) + (sum ~/ 10);
              }
              return sum;
            }

            int get bhagyank {
              int sum = dob.day + dob.month + dob.year;
              while (sum > 9) {
                int s = 0;
                while (sum > 0) {
                  s += sum % 10;
                  sum ~/= 10;
                }
                sum = s;
              }
              return sum;
            }

            Map<String, dynamic> calculateAstroEngine() {
              int y = dob.year;
              int m = dob.month;
              int d = dob.day;
              if (m <= 2) {
                y -= 1;
                m += 12;
              }
              int a = y ~/ 100;
              int b = 2 - a + (a ~/ 4);
              double jd = (365.25 * (y + 4716)).floor() + (30.6001 * (m + 1)).floor() + d + b - 1524.5;
              double decHours = birthTime.hour + (birthTime.minute / 60.0) - 5.5; // IST to UTC
              jd += decHours / 24.0;

              double t = (jd - 2451545.0) / 36525.0;

              // Sun Mean Longitude
              double l0 = 280.46646 + 36000.76983 * t;
              double mSun = 357.52911 + 35999.05029 * t;
              double sunTrueLng = (l0 + 1.914602 * math.sin(mSun * math.pi / 180.0)) % 360.0;
              if (sunTrueLng < 0) sunTrueLng += 360.0;

              // Moon Mean Longitude
              double moonL = 218.3165 + 481267.8813 * t;
              double moonLng = (moonL + 6.289 * math.sin((134.963 + 477198.867 * t) * math.pi / 180.0)) % 360.0;
              if (moonLng < 0) moonLng += 360.0;

              // Lahiri Ayanamsha approx
              double ayanamsha = 23.85 + (dob.year - 2000) * 0.01397;
              double nirayanaMoon = (moonLng - ayanamsha) % 360.0;
              if (nirayanaMoon < 0) nirayanaMoon += 360.0;

              double nirayanaSun = (sunTrueLng - ayanamsha) % 360.0;
              if (nirayanaSun < 0) nirayanaSun += 360.0;

              // Sidereal Time at Greenwich
              double gmst = (280.46061837 + 360.98564736629 * (jd - 2451545.0)) % 360.0;
              double lmst = (gmst + longitude) % 360.0;
              if (lmst < 0) lmst += 360.0;

              // Ascendant (Lagna)
              double ramcRad = lmst * math.pi / 180.0;
              double epsRad = 23.44 * math.pi / 180.0;
              double latRad = latitude * math.pi / 180.0;
              double ascRad = math.atan2(math.cos(ramcRad), -math.sin(ramcRad) * math.cos(epsRad) - math.tan(latRad) * math.sin(epsRad));
              double sayanaAsc = (ascRad * 180.0 / math.pi) % 360.0;
              if (sayanaAsc < 0) sayanaAsc += 360.0;
              double nirayanaAsc = (sayanaAsc - ayanamsha) % 360.0;
              if (nirayanaAsc < 0) nirayanaAsc += 360.0;

              final rashiNames = [
                'Mesha (Aries)', 'Vrishabha (Taurus)', 'Mithuna (Gemini)', 'Karka (Cancer)',
                'Simha (Leo)', 'Kanya (Virgo)', 'Tula (Libra)', 'Vrischika (Scorpio)',
                'Dhanus (Sagittarius)', 'Makara (Capricorn)', 'Kumbha (Aquarius)', 'Meena (Pisces)'
              ];

              int lagnaIdx = (nirayanaAsc / 30.0).floor() % 12;
              int rashiIdx = (nirayanaMoon / 30.0).floor() % 12;
              int sunRashiIdx = (nirayanaSun / 30.0).floor() % 12;

              final nakshatraNames = [
                'Ashwini', 'Bharani', 'Krittika', 'Rohini', 'Mrigashira', 'Ardra',
                'Punarvasu', 'Pushya', 'Ashlesha', 'Magha', 'Purva Phalguni', 'Uttara Phalguni',
                'Hasta', 'Chitra', 'Swati', 'Vishakha', 'Anuradha', 'Jyeshtha',
                'Mula', 'Purva Ashadha', 'Uttara Ashadha', 'Shravana', 'Dhanishta', 'Shatabhisha',
                'Purva Bhadrapada', 'Uttara Bhadrapada', 'Revati'
              ];
              int nakIdx = (nirayanaMoon / (360.0 / 27.0)).floor() % 27;

              // KP 12 Houses Cusps
              List<Map<String, dynamic>> cusps = [];
              for (int i = 0; i < 12; i++) {
                double cDeg = (nirayanaAsc + (i * 30.0)) % 360.0;
                int cRashi = (cDeg / 30.0).floor() % 12;
                cusps.add({
                  'h': 'H${i + 1}',
                  'deg': cDeg,
                  'sign': rashiNames[cRashi].split(' ')[0],
                });
              }

              // Dynamic Graha Degrees based on planetary offsets from Sun
              Map<String, double> planets = {
                'Sun': nirayanaSun,
                'Moon': nirayanaMoon,
                'Mars': (nirayanaSun - 12.0 + (dob.day * 1.5)) % 360.0,
                'Mercury': (nirayanaSun + 18.0) % 360.0,
                'Jupiter': (nirayanaAsc + 145.0 + (dob.year % 12) * 30.0) % 360.0,
                'Venus': (nirayanaSun + 42.0) % 360.0,
                'Saturn': (nirayanaAsc + 180.0 + (dob.year % 30) * 12.0) % 360.0,
                'Rahu': (360.0 - ((jd - 2451545.0) * 0.05295)) % 360.0,
                'Ketu': ((360.0 - ((jd - 2451545.0) * 0.05295)) + 180.0) % 360.0,
              };

              planets.forEach((k, v) {
                if (planets[k]! < 0) planets[k] = planets[k]! + 360.0;
              });

              return {
                'lagna': rashiNames[lagnaIdx],
                'lagnaDeg': nirayanaAsc % 30.0,
                'rashi': rashiNames[rashiIdx],
                'rashiDeg': nirayanaMoon % 30.0,
                'sunSign': rashiNames[sunRashiIdx],
                'nakshatra': nakshatraNames[nakIdx],
                'cusps': cusps,
                'planets': planets,
              };
            }
          }

          class MainMasterDashboard extends StatefulWidget {
            const MainMasterDashboard({super.key});

            @override
            State<MainMasterDashboard> createState() => _MainMasterDashboardState();
          }

          class _MainMasterDashboardState extends State<MainMasterDashboard> {
            final MasterClientData client = MasterClientData();
            File? mapImage;
            Uint8List? mapImageBytes;
            List<Offset> plotPoints = [];
            int currentTab = 0;

            Offset? getCentroid(List<Offset> pts) {
              if (pts.length < 3) return null;
              double area = 0.0, cx = 0.0, cy = 0.0;
              for (int i = 0; i < pts.length; i++) {
                int j = (i + 1) % pts.length;
                double factor = (pts[i].dx * pts[j].dy) - (pts[j].dx * pts[i].dy);
                area += factor;
                cx += (pts[i].dx + pts[j].dx) * factor;
                cy += (pts[i].dy + pts[j].dy) * factor;
              }
              area *= 0.5;
              if (area.abs() < 0.001) return null;
              return Offset(cx / (6 * area), cy / (6 * area));
            }

            @override
            Widget build(BuildContext context) {
              Offset? centroid = getCentroid(plotPoints);

              final screens = [
                ClientInputScreen(client: client, onUpdate: () => setState(() {})),
                VastuMapEditor(
                  client: client,
                  mapImage: mapImage,
                  points: plotPoints,
                  centroid: centroid,
                  northDegree: client.northDegree,
                  onPickImage: (f, b) => setState(() {
                    mapImage = f;
                    mapImageBytes = b;
                  }),
                  onPointsUpdate: (pts) => setState(() => plotPoints = pts),
                  onDegreeChanged: (deg) => setState(() => client.northDegree = deg),
                ),
                ZonalAreaEditorScreen(client: client, onUpdate: () => setState(() {})),
                AstroCalculationsScreen(client: client),
                PdfReportPreviewScreen(
                  client: client,
                  mapImageBytes: mapImageBytes,
                  points: plotPoints,
                  centroid: centroid,
                ),
              ];

              return Scaffold(
                body: screens[currentTab],
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: currentTab,
                  selectedItemColor: Colors.tealAccent,
                  unselectedItemColor: Colors.grey,
                  backgroundColor: const Color(0xFF1E1E1E),
                  type: BottomNavigationBarType.fixed,
                  onTap: (idx) => setState(() => currentTab = idx),
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.person), label: 'Client / Place'),
                    BottomNavigationBarItem(icon: Icon(Icons.architecture), label: 'Ruler & Map'),
                    BottomNavigationBarItem(icon: Icon(Icons.bar_chart), label: 'Plot & Graph'),
                    BottomNavigationBarItem(icon: Icon(Icons.auto_awesome), label: 'Astro-KP'),
                    BottomNavigationBarItem(icon: Icon(Icons.picture_as_pdf), label: 'Glohani PDF'),
                  ],
                ),
              );
            }
          }

          class ClientInputScreen extends StatefulWidget {
            final MasterClientData client;
            final VoidCallback onUpdate;
            const ClientInputScreen({super.key, required this.client, required this.onUpdate});

            @override
            State<ClientInputScreen> createState() => _ClientInputScreenState();
          }

          class _ClientInputScreenState extends State<ClientInputScreen> {
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Client & Astro Profile'), centerTitle: true),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    TextFormField(
                      initialValue: widget.client.name,
                      decoration: const InputDecoration(labelText: 'Client Name', border: OutlineInputBorder()),
                      onChanged: (v) { widget.client.name = v; widget.onUpdate(); },
                    ),
                    const SizedBox(height: 12),
                    TextFormField(
                      initialValue: widget.client.address,
                      decoration: const InputDecoration(labelText: 'Property Address', border: OutlineInputBorder()),
                      onChanged: (v) { widget.client.address = v; widget.onUpdate(); },
                    ),
                    const SizedBox(height: 12),
                    // AUTO-COMPLETE PLACE / CITY SEARCH
                    Autocomplete<CityData>(
                      initialValue: TextEditingValue(text: widget.client.birthPlace),
                      displayStringForOption: (CityData option) => option.name,
                      optionsBuilder: (TextEditingValue textEditingValue) {
                        if (textEditingValue.text.isEmpty) {
                          return const Iterable<CityData>.empty();
                        }
                        return kIndianCities.where((CityData option) {
                          return option.name.toLowerCase().contains(textEditingValue.text.toLowerCase());
                        });
                      },
                      onSelected: (CityData selection) {
                        setState(() {
                          widget.client.birthPlace = selection.name;
                          widget.client.latitude = selection.lat;
                          widget.client.longitude = selection.lng;
                          widget.onUpdate();
                        });
                      },
                      fieldViewBuilder: (context, controller, focusNode, onFieldSubmitted) {
                        return TextFormField(
                          controller: controller,
                          focusNode: focusNode,
                          decoration: InputDecoration(
                            labelText: 'Birth Place (Type Jalor, Jodhpur, etc.)',
                            border: const OutlineInputBorder(),
                            suffixIcon: IconButton(
                              icon: const Icon(Icons.location_city, color: Colors.tealAccent),
                              onPressed: () {},
                            ),
                          ),
                          onChanged: (v) {
                            widget.client.birthPlace = v;
                            // Search if exact match exists
                            for (var c in kIndianCities) {
                              if (c.name.toLowerCase().contains(v.toLowerCase())) {
                                widget.client.latitude = c.lat;
                                widget.client.longitude = c.lng;
                                break;
                              }
                            }
                            widget.onUpdate();
                          },
                        );
                      },
                    ),
                    const SizedBox(height: 6),
                    Text('Auto Coordinates: Lat ${widget.client.latitude.toStringAsFixed(2)}°, Lng ${widget.client.longitude.toStringAsFixed(2)}°',
                        style: const TextStyle(fontSize: 11, color: Colors.tealAccent)),
                    const SizedBox(height: 14),
                    const Text('Astro-Vastu Birth Details', style: TextStyle(color: Colors.tealAccent, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 8),
                    ListTile(
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8), side: const BorderSide(color: Colors.white24)),
                      title: Text('DOB: ${DateFormat('dd-MM-yyyy').format(widget.client.dob)}'),
                      trailing: const Icon(Icons.calendar_today, color: Colors.tealAccent),
                      onTap: () async {
                        DateTime? d = await showDatePicker(
                          context: context,
                          initialDate: widget.client.dob,
                          firstDate: DateTime(1940),
                          lastDate: DateTime(2035),
                        );
                        if (d != null) {
                          setState(() {
                            widget.client.dob = d;
                            widget.onUpdate();
                          });
                        }
                      },
                    ),
                    const SizedBox(height: 10),
                    ListTile(
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8), side: const BorderSide(color: Colors.white24)),
                      title: Text('Birth Time: ${widget.client.formattedBirthTime}'),
                      trailing: const Icon(Icons.access_time, color: Colors.tealAccent),
                      onTap: () async {
                        TimeOfDay? t = await showTimePicker(context: context, initialTime: widget.client.birthTime);
                        if (t != null) {
                          setState(() {
                            widget.client.birthTime = t;
                            widget.onUpdate();
                          });
                        }
                      },
                    ),
                    const SizedBox(height: 14),
                    DropdownButtonFormField<String>(
                      value: widget.client.propertyType,
                      decoration: const InputDecoration(labelText: 'Property Type', border: OutlineInputBorder()),
                      items: ['HOME', 'FLAT', 'OFFICE', 'LAND', 'COMMERCIAL SPACE', 'FACTORY']
                          .map((e) => DropdownMenuItem(value: e, child: Text(e)))
                          .toList(),
                      onChanged: (v) { if (v != null) { widget.client.propertyType = v; widget.onUpdate(); } },
                    ),
                  ],
                ),
              );
            }
          }

          class VastuMapEditor extends StatefulWidget {
            final MasterClientData client;
            final File? mapImage;
            final List<Offset> points;
            final Offset? centroid;
            final double northDegree;
            final Function(File, Uint8List) onPickImage;
            final Function(List<Offset>) onPointsUpdate;
            final Function(double) onDegreeChanged;

            const VastuMapEditor({
              super.key,
              required this.client,
              required this.mapImage,
              required this.points,
              required this.centroid,
              required this.northDegree,
              required this.onPickImage,
              required this.onPointsUpdate,
              required this.onDegreeChanged,
            });

            @override
            State<VastuMapEditor> createState() => _VastuMapEditorState();
          }

          class _VastuMapEditorState extends State<VastuMapEditor> {
            int? draggedIdx;
            bool isDotMode = false;
            final TransformationController _transController = TransformationController();

            int maxGridFeet = 30;

            double get pixelsPerFoot {
              return 300.0 / maxGridFeet;
            }

            void recalculateDimensionsFromPoints() {
              if (widget.points.length >= 3) {
                double minX = widget.points.map((p) => p.dx).reduce(math.min);
                double maxX = widget.points.map((p) => p.dx).reduce(math.max);
                double minY = widget.points.map((p) => p.dy).reduce(math.min);
                double maxY = widget.points.map((p) => p.dy).reduce(math.max);

                double measuredW = (maxX - minX) / pixelsPerFoot;
                double measuredL = (maxY - minY) / pixelsPerFoot;

                if (measuredW > 2 && measuredL > 2) {
                  widget.client.plotWidth = double.parse(measuredW.toStringAsFixed(1));
                  widget.client.plotLength = double.parse(measuredL.toStringAsFixed(1));
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text('Plot: ${widget.client.plotWidth}ft x ${widget.client.plotLength}ft'),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.photo_library),
                      tooltip: 'Upload Floor Plan',
                      onPressed: () async {
                        final p = await ImagePicker().pickImage(source: ImageSource.gallery);
                        if (p != null) {
                          final bytes = await p.readAsBytes();
                          widget.onPickImage(File(p.path), bytes);
                        }
                      },
                    ),
                    IconButton(
                      icon: const Icon(Icons.delete_outline, color: Colors.redAccent),
                      tooltip: 'Clear All Dots',
                      onPressed: () {
                        setState(() {
                          widget.points.clear();
                          widget.onPointsUpdate([]);
                        });
                      },
                    )
                  ],
                ),
                body: Column(
                  children: [
                    Container(
                      color: const Color(0xFF1B1B1B),
                      padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          const Text('Grid Scale:', style: TextStyle(fontSize: 11, color: Colors.white70, fontWeight: FontWeight.bold)),
                          Wrap(
                            spacing: 6,
                            children: [25, 50, 100].map((ft) {
                              bool sel = maxGridFeet == ft;
                              return ChoiceChip(
                                label: Text('$ft ft', style: TextStyle(fontSize: 10, color: sel ? Colors.black : Colors.white)),
                                selected: sel,
                                selectedColor: Colors.tealAccent,
                                backgroundColor: const Color(0xFF2A2A2A),
                                onSelected: (b) {
                                  if (b) setState(() => maxGridFeet = ft);
                                },
                              );
                            }).toList(),
                          ),
                        ],
                      ),
                    ),
                    Container(
                      color: const Color(0xFF242424),
                      padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                      child: Row(
                        children: [
                          Expanded(
                            child: ElevatedButton.icon(
                              style: ElevatedButton.styleFrom(
                                backgroundColor: !isDotMode ? Colors.tealAccent : Colors.grey[800],
                                foregroundColor: !isDotMode ? Colors.black : Colors.white70,
                              ),
                              icon: const Icon(Icons.pan_tool, size: 16),
                              label: const Text('1. Move & Resize Photo', style: TextStyle(fontSize: 11, fontWeight: FontWeight.bold)),
                              onPressed: () => setState(() => isDotMode = false),
                            ),
                          ),
                          const SizedBox(width: 8),
                          Expanded(
                            child: ElevatedButton.icon(
                              style: ElevatedButton.styleFrom(
                                backgroundColor: isDotMode ? Colors.amberAccent : Colors.grey[800],
                                foregroundColor: isDotMode ? Colors.black : Colors.white70,
                              ),
                              icon: const Icon(Icons.control_point, size: 16),
                              label: const Text('2. Lock Photo & Set Dots', style: TextStyle(fontSize: 11, fontWeight: FontWeight.bold)),
                              onPressed: () => setState(() => isDotMode = true),
                            ),
                          ),
                        ],
                      ),
                    ),
                    Expanded(
                      child: Stack(
                        fit: StackFit.expand,
                        children: [
                          Container(
                            color: const Color(0xFF141414),
                            child: widget.mapImage != null
                                ? InteractiveViewer(
                                    transformationController: _transController,
                                    boundaryMargin: const EdgeInsets.all(double.infinity),
                                    maxScale: 15.0,
                                    minScale: 0.02,
                                    panEnabled: !isDotMode,
                                    scaleEnabled: !isDotMode,
                                    child: Center(
                                      child: Image.file(widget.mapImage!, fit: BoxFit.contain),
                                    ),
                                  )
                                : const Center(child: Text('Tap gallery icon to load map.\nSelect Grid Range (25ft/50ft).\nUse Mode 1 to Move/Resize.\nUse Mode 2 to place corner dots.')),
                          ),
                          IgnorePointer(
                            child: CustomPaint(
                              painter: RulerGridPainter(
                                pixelsPerFoot: pixelsPerFoot,
                                maxFeet: maxGridFeet,
                              ),
                            ),
                          ),
                          if (isDotMode)
                            GestureDetector(
                              onPanDown: (d) {
                                for (int i = 0; i < widget.points.length; i++) {
                                  if ((widget.points[i] - d.localPosition).distance < 28) {
                                    draggedIdx = i;
                                    return;
                                  }
                                }
                                setState(() {
                                  widget.points.add(d.localPosition);
                                  widget.onPointsUpdate(List.from(widget.points));
                                  recalculateDimensionsFromPoints();
                                });
                              },
                              onPanUpdate: (d) {
                                if (draggedIdx != null) {
                                  setState(() {
                                    widget.points[draggedIdx!] = d.localPosition;
                                    widget.onPointsUpdate(List.from(widget.points));
                                    recalculateDimensionsFromPoints();
                                  });
                                }
                              },
                              onPanEnd: (_) => draggedIdx = null,
                              child: CustomPaint(
                                painter: InteractivePlotPainter(
                                  points: widget.points,
                                  centroid: widget.centroid,
                                  northDegree: widget.northDegree,
                                ),
                              ),
                            )
                          else
                            IgnorePointer(
                              child: CustomPaint(
                                painter: InteractivePlotPainter(
                                  points: widget.points,
                                  centroid: widget.centroid,
                                  northDegree: widget.northDegree,
                                ),
                              ),
                            ),
                        ],
                      ),
                    ),
                    Container(
                      color: const Color(0xFF1E1E1E),
                      padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                      child: Row(
                        children: [
                          const Text('North: ', style: TextStyle(color: Colors.tealAccent, fontWeight: FontWeight.bold)),
                          Expanded(
                            child: Slider(
                              value: widget.northDegree,
                              min: 0,
