name: Build Glohani Vastu 37-Page Suite APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Generate Glohani Vastu Master Suite
        run: |
          rm -rf lib android
          flutter create --template=app --org=com.glohani.vastureport --project-name=glohani_vastu_pro . --overwrite
          
          cat << 'EOF' > pubspec.yaml
          name: glohani_vastu_pro
          description: Glohani Vastu Exact 37-Page Professional Evaluation Suite
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            image_picker: ^1.0.7
            path_provider: ^2.1.2
            share_plus: ^7.2.2
            pdf: ^3.10.7
            printing: ^5.11.1
            intl: ^0.19.0

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
            assets:
              - assets/images/
          EOF

          mkdir -p lib
          cat << 'EOF' > lib/main.dart
