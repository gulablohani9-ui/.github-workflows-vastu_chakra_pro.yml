                                child: pw.Column(
                                  mainAxisAlignment: pw.MainAxisAlignment.end,
                                  children: [
                                    pw.Text(ratio.toStringAsFixed(2), style: pw.TextStyle(fontSize: 6.5, color: barColor, fontWeight: pw.FontWeight.bold)),
                                    pw.SizedBox(height: 2),
                                    pw.Container(height: barHeight, margin: const pw.EdgeInsets.symmetric(horizontal: 2), color: barColor),
                                    pw.SizedBox(height: 4),
                                    pw.Text(z, style: const pw.TextStyle(fontSize: 7.5)),
                                  ],
                                ),
                              );
                            }),
                          ),
                        ),
