                  pw.SizedBox(height: 6),
                  pw.Text('Common Friends Between Mulank and Bhagank:', style: pw.TextStyle(fontSize: 9, fontWeight: pw.FontWeight.bold, color: PdfColors.black)),
                  pw.SizedBox(height: 2),
                  buildCheckRow('', commonStr, valColor: PdfColors.teal800),
                  pw.Spacer(),
                  buildFooter(),
                ],
              );
            }

