name: Build AstroVastu Report Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Generate Full AstroVastu Report Pro Suite
        run: |
          rm -rf lib android
          flutter create --template=app --org=com.astro.vastureport --project-name=astrovastu_report_pro . --overwrite
          
          cat << 'EOF' > pubspec.yaml
          name: astrovastu_report_pro
          description: Full 37-Page Style Astro-Vastu Professional Evaluation Report Suite
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            image_picker: ^1.0.7
            screenshot: ^2.1.0
            path_provider: ^2.1.2
            share_plus: ^7.2.2
            pdf: ^3.10.7
            printing: ^5.11.1
            intl: ^0.19.0

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          EOF

          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'dart:math' as math;
          import 'dart:typed_data';
          import 'dart:ui' as ui;
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:screenshot/screenshot.dart';
          import 'package:pdf/pdf.dart';
          import 'package:pdf/widgets.dart' as pw;
          import 'package:printing/printing.dart';
          import 'package:intl/intl.dart';

          void main() {
            runApp(const AstroVastuApp());
          }

          class AstroVastuApp extends StatelessWidget {
            const AstroVastuApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'AstroVastu Report Pro',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF121212),
                  primaryColor: Colors.tealAccent,
                  colorScheme: const ColorScheme.dark(
                    primary: Colors.tealAccent,
                    surface: Color(0xFF1E1E1E),
                  ),
                ),
                home: const MainDashboard(),
              );
            }
          }

          class ClientData {
            String name = "Ghanshyam";
            String propertyType = "FLAT";
            String address = "Jodhpur, Rajasthan, India";
            DateTime dob = DateTime(1983, 6, 30);
            TimeOfDay birthTime = const TimeOfDay(hour: 1, minute: 20);
            String birthPlace = "Jodhpur, Rajasthan, India";
            double northDegree = 15.0;

            String get formattedBirthTime {
              final h = birthTime.hour.toString().padLeft(2, '0');
              final m = birthTime.minute.toString().padLeft(2, '0');
              return "$h:$m";
            }
          }

          class MainDashboard extends StatefulWidget {
            const MainDashboard({super.key});

            @override
            State<MainDashboard> createState() => _MainDashboardState();
          }

          class _MainDashboardState extends State<MainDashboard> {
            final ClientData client = ClientData();
            File? mapImage;
            List<Offset> plotPoints = [];
            final ScreenshotController screenshotController = ScreenshotController();
            int currentTab = 0;

            Offset? getCentroid(List<Offset> pts) {
              if (pts.length < 3) return null;
              double area = 0.0, cx = 0.0, cy = 0.0;
              for (int i = 0; i < pts.length; i++) {
                int j = (i + 1) % pts.length;
                double factor = (pts[i].dx * pts[j].dy) - (pts[j].dx * pts[i].dy);
                area += factor;
                cx += (pts[i].dx + pts[j].dx) * factor;
                cy += (pts[i].dy + pts[j].dy) * factor;
              }
              area *= 0.5;
              if (area.abs() < 0.001) return null;
              return Offset(cx / (6 * area), cy / (6 * area));
            }

            @override
            Widget build(BuildContext context) {
              Offset? centroid = getCentroid(plotPoints);

              final screens = [
                ClientInputScreen(
                  client: client,
                  onUpdate: () => setState(() {}),
                ),
                VastuMapEditor(
                  mapImage: mapImage,
                  points: plotPoints,
                  centroid: centroid,
                  northDegree: client.northDegree,
                  screenshotController: screenshotController,
                  onPickImage: (f) => setState(() => mapImage = f),
                  onPointsUpdate: (pts) => setState(() => plotPoints = pts),
                  onDegreeChanged: (deg) => setState(() => client.northDegree = deg),
                ),
                AstroCalculationsScreen(client: client),
                PdfReportPreviewScreen(
                  client: client,
                  mapImage: mapImage,
                  points: plotPoints,
                  centroid: centroid,
                  screenshotController: screenshotController,
                ),
              ];

              return Scaffold(
                body: screens[currentTab],
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: currentTab,
                  selectedItemColor: Colors.tealAccent,
                  unselectedItemColor: Colors.grey,
                  backgroundColor: const Color(0xFF1E1E1E),
                  type: BottomNavigationBarType.fixed,
                  onTap: (idx) => setState(() => currentTab = idx),
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.person), label: 'Client / DOB'),
                    BottomNavigationBarItem(icon: Icon(Icons.architecture), label: 'Map & Degree'),
                    BottomNavigationBarItem(icon: Icon(Icons.auto_awesome), label: 'Astro-Vastu'),
                    BottomNavigationBarItem(icon: Icon(Icons.picture_as_pdf), label: 'Full PDF Report'),
                  ],
                ),
              );
            }
          }

          class ClientInputScreen extends StatelessWidget {
            final ClientData client;
            final VoidCallback onUpdate;
            const ClientInputScreen({super.key, required this.client, required this.onUpdate});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Client & Astro Details'), centerTitle: true),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    TextFormField(
                      initialValue: client.name,
                      decoration: const InputDecoration(labelText: 'Client Name', border: OutlineInputBorder()),
                      onChanged: (v) { client.name = v; onUpdate(); },
                    ),
                    const SizedBox(height: 12),
                    TextFormField(
                      initialValue: client.address,
                      decoration: const InputDecoration(labelText: 'Property Address', border: OutlineInputBorder()),
                      onChanged: (v) { client.address = v; onUpdate(); },
                    ),
                    const SizedBox(height: 12),
                    DropdownButtonFormField<String>(
                      value: client.propertyType,
                      decoration: const InputDecoration(labelText: 'Property Type', border: OutlineInputBorder()),
                      items: ['FLAT', 'HOME', 'OFFICE', 'LAND', 'COMMERCIAL SPACE', 'FACTORY']
                          .map((e) => DropdownMenuItem(value: e, child: Text(e)))
                          .toList(),
                      onChanged: (v) { if (v != null) { client.propertyType = v; onUpdate(); } },
                    ),
                    const SizedBox(height: 16),
                    const Text('Astro-Vastu Birth Details', style: TextStyle(color: Colors.tealAccent, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 10),
                    ListTile(
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8), side: const BorderSide(color: Colors.white24)),
                      title: Text('DOB: ${DateFormat('dd-MM-yyyy').format(client.dob)}'),
                      trailing: const Icon(Icons.calendar_today, color: Colors.tealAccent),
                      onTap: () async {
                        DateTime? d = await showDatePicker(
                          context: context,
                          initialDate: client.dob,
                          firstDate: DateTime(1940),
                          lastDate: DateTime(2035),
                        );
                        if (d != null) { client.dob = d; onUpdate(); }
                      },
                    ),
                    const SizedBox(height: 10),
                    ListTile(
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8), side: const BorderSide(color: Colors.white24)),
                      title: Text('Birth Time: ${client.formattedBirthTime}'),
                      trailing: const Icon(Icons.access_time, color: Colors.tealAccent),
                      onTap: () async {
                        TimeOfDay? t = await showTimePicker(context: context, initialTime: client.birthTime);
                        if (t != null) { client.birthTime = t; onUpdate(); }
                      },
                    ),
                    const SizedBox(height: 12),
                    TextFormField(
                      initialValue: client.birthPlace,
                      decoration: const InputDecoration(labelText: 'Birth Place', border: OutlineInputBorder()),
                      onChanged: (v) { client.birthPlace = v; onUpdate(); },
                    ),
                  ],
                ),
              );
            }
          }

          class VastuMapEditor extends StatefulWidget {
            final File? mapImage;
            final List<Offset> points;
            final Offset? centroid;
            final double northDegree;
            final ScreenshotController screenshotController;
            final Function(File) onPickImage;
            final Function(List<Offset>) onPointsUpdate;
            final Function(double) onDegreeChanged;

            const VastuMapEditor({
              super.key,
              required this.mapImage,
              required this.points,
              required this.centroid,
              required this.northDegree,
              required this.screenshotController,
              required this.onPickImage,
              required this.onPointsUpdate,
              required this.onDegreeChanged,
            });

            @override
            State<VastuMapEditor> createState() => _VastuMapEditorState();
          }

          class _VastuMapEditorState extends State<VastuMapEditor> {
            int? draggedIdx;

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Plot Boundary & Centroid'),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.photo_library),
                      onPressed: () async {
                        final p = await ImagePicker().pickImage(source: ImageSource.gallery);
                        if (p != null) widget.onPickImage(File(p.path));
                      },
                    ),
                    IconButton(
                      icon: const Icon(Icons.refresh, color: Colors.redAccent),
                      onPressed: () => widget.onPointsUpdate([]),
                    )
                  ],
                ),
                body: Column(
                  children: [
                    Expanded(
                      child: Screenshot(
                        controller: widget.screenshotController,
                        child: GestureDetector(
                          onPanDown: (d) {
                            for (int i = 0; i < widget.points.length; i++) {
                              if ((widget.points[i] - d.localPosition).distance < 25) {
                                draggedIdx = i;
                                return;
                              }
                            }
                            List<Offset> up = List.from(widget.points)..add(d.localPosition);
                            widget.onPointsUpdate(up);
                          },
                          onPanUpdate: (d) {
                            if (draggedIdx != null) {
                              List<Offset> up = List.from(widget.points);
                              up[draggedIdx!] = d.localPosition;
                              widget.onPointsUpdate(up);
                            }
                          },
                          onPanEnd: (_) => draggedIdx = null,
                          child: Stack(
                            fit: StackFit.expand,
                            children: [
                              Container(
                                color: Colors.black,
                                child: widget.mapImage != null
                                    ? Image.file(widget.mapImage!, fit: BoxFit.contain)
                                    : const Center(child: Text('Tap Gallery icon above to upload floor plan\nTap corners to set boundary dots', textAlign: TextAlign.center)),
                              ),
                              CustomPaint(
                                painter: ReportVastuPainter(
                                  points: widget.points,
                                  centroid: widget.centroid,
                                  northDegree: widget.northDegree,
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                    Container(
                      color: const Color(0xFF1E1E1E),
                      padding: const EdgeInsets.all(12),
                      child: Row(
                        children: [
                          const Text('North Degree: ', style: TextStyle(color: Colors.tealAccent, fontWeight: FontWeight.bold)),
                          Expanded(
                            child: Slider(
                              value: widget.northDegree,
                              min: 0,
                              max: 360,
                              onChanged: widget.onDegreeChanged,
                            ),
                          ),
                          Text('${widget.northDegree.toInt()}°', style: const TextStyle(fontWeight: FontWeight.bold)),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class AstroCalculationsScreen extends StatelessWidget {
            final ClientData client;
            const AstroCalculationsScreen({super.key, required this.client});

            int calcMulank(DateTime dt) {
              int d = dt.day;
              return d > 9 ? (d ~/ 10 + d % 10) : d;
            }

            int calcBhagyank(DateTime dt) {
              int sum = dt.day + dt.month + dt.year;
              while (sum > 9) {
                int temp = 0;
                while (sum > 0) { temp += sum % 10; sum ~/= 10; }
                sum = temp;
              }
              return sum;
            }

            @override
            Widget build(BuildContext context) {
              int mulank = calcMulank(client.dob);
              int bhagyank = calcBhagyank(client.dob);

              return Scaffold(
                appBar: AppBar(title: const Text('Astro-Vastu Matrix'), centerTitle: true),
                body: ListView(
                  padding: const EdgeInsets.all(14),
                  children: [
                    Card(
                      child: Padding(
                        padding: const EdgeInsets.all(12.0),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text('Numerology (Loshu Grid Basis)', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.tealAccent)),
                            const SizedBox(height: 6),
                            Text('• Psychic Number (Mulank): $mulank'),
                            Text('• Destiny Number (Bhagyank): $bhagyank'),
                            Text('• Friendly Numbers: 1, 5, 6 | Neutral: 3, 7'),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 10),
                    Card(
                      child: Padding(
                        padding: const EdgeInsets.all(12.0),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: const [
                            Text('16 Vastu Zones & Connected Life Areas', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.tealAccent)),
                            SizedBox(height: 6),
                            Text('• North: Opportunities, Treasury, Liquid Cash'),
                            Text('• North-East (NE): Clarity of Mind, Health Immunity'),
                            Text('• East: Social Connectivity, Fame, Recognition'),
                            Text('• South-East (SE): Fire, Cash Liquidity, Digestion'),
                            Text('• South: Rest, Relaxation, Legal Victory'),
                            Text('• South-West (SW): Skills, Relationship, Stability'),
                            Text('• West: Gains, Profits, Realized Wealth'),
                            Text('• North-West (NW): Banking Support, Relatives & Allies'),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class PdfReportPreviewScreen extends StatelessWidget {
            final ClientData client;
            final File? mapImage;
            final List<Offset> points;
            final Offset? centroid;
            final ScreenshotController screenshotController;

            const PdfReportPreviewScreen({
              super.key,
              required this.client,
              required this.mapImage,
              required this.points,
              required this.centroid,
              required this.screenshotController,
            });

            int getMulank(DateTime dt) {
              int d = dt.day;
              return d > 9 ? (d ~/ 10 + d % 10) : d;
            }

            int getBhagyank(DateTime dt) {
              int sum = dt.day + dt.month + dt.year;
              while (sum > 9) {
                int temp = 0;
                while (sum > 0) { temp += sum % 10; sum ~/= 10; }
                sum = temp;
              }
              return sum;
            }

            Future<Uint8List> generateFullReport(PdfPageFormat format) async {
              final pdf = pw.Document();
              Uint8List? mapBytes;
              try {
                mapBytes = await screenshotController.capture();
              } catch (_) {}

              final mulank = getMulank(client.dob);
              final bhagyank = getBhagyank(client.dob);

              // 1. COVER PAGE WITH VASTU MANDALA HEADER
              pdf.addPage(
                pw.Page(
                  pageFormat: format,
                  build: (pw.Context ctx) => pw.Container(
                    padding: const pw.EdgeInsets.all(24),
                    child: pw.Column(
                      crossAxisAlignment: pw.CrossAxisAlignment.center,
                      mainAxisAlignment: pw.MainAxisAlignment.spaceBetween,
                      children: [
                        pw.Container(
                          padding: const pw.EdgeInsets.symmetric(vertical: 8, horizontal: 16),
                          decoration: pw.BoxDecoration(border: pw.Border.all(color: PdfColors.teal, width: 2)),
                          child: pw.Text('VASTU EVALUATION REPORT', style: pw.TextStyle(fontSize: 22, fontWeight: pw.FontWeight.bold, color: PdfColors.teal)),
                        ),
                        pw.Text('FOR HOME - FLAT - APARTMENTS - COMMERCIAL', style: pw.TextStyle(fontSize: 12, color: PdfColors.grey700, fontWeight: pw.FontWeight.bold)),
                        pw.SizedBox(height: 10),
                        pw.Container(
                          width: 220,
                          height: 220,
                          decoration: pw.BoxDecoration(
                            shape: pw.BoxShape.circle,
                            border: pw.Border.all(color: PdfColors.amber800, width: 3),
                          ),
                          child: pw.Center(
                            child: pw.Column(
                              mainAxisAlignment: pw.MainAxisAlignment.center,
                              children: [
                                pw.Text('Ether (Space)', style: pw.TextStyle(fontSize: 12, fontWeight: pw.FontWeight.bold, color: PdfColors.amber)),
                                pw.Text('Air | Fire | Water | Earth', style: const pw.TextStyle(fontSize: 10, color: PdfColors.grey700)),
                                pw.SizedBox(height: 4),
                                pw.Text('VASTU PURUSHA MANDALA', style: pw.TextStyle(fontSize: 9, fontWeight: pw.FontWeight.bold)),
                              ],
                            ),
                          ),
                        ),
                        pw.SizedBox(height: 10),
                        pw.Container(
                          padding: const pw.EdgeInsets.all(12),
                          decoration: pw.BoxDecoration(border: pw.Border.all(color: PdfColors.teal), color: PdfColors.grey100),
                          child: pw.Column(
                            crossAxisAlignment: pw.CrossAxisAlignment.start,
                            children: [
                              pw.Text('CLIENT NAME: ${client.name.toUpperCase()}', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 13)),
                              pw.Text('ADDRESS: ${client.address}'),
                              pw.Text('PROPERTY TYPE: [ ${client.propertyType} ]'),
                              pw.Text('EVALUATION DATE: ${DateFormat('dd/MM/yyyy').format(DateTime.now())}'),
                              pw.Text('NORTH DEGREE TILT: ${client.northDegree.toInt()}° Toward West/East'),
                            ],
                          ),
                        ),
                        pw.SizedBox(height: 10),
                        pw.Text('ACCURATE COMBINATION OF DASHA & DISHA', style: pw.TextStyle(fontSize: 13, fontWeight: pw.FontWeight.bold, fontStyle: pw.FontStyle.italic, color: PdfColors.teal)),
                        pw.Text('Professional Applied Vastu & Astro-Vastu Consultation Report', style: const pw.TextStyle(fontSize: 9, color: PdfColors.grey600)),
                      ],
                    ),
                  ),
                ),
              );

              // 2. CONTENTS & INDEX PAGE
              pdf.addPage(
                pw.Page(
                  pageFormat: format,
                  build: (pw.Context ctx) => pw.Column(
                    crossAxisAlignment: pw.CrossAxisAlignment.start,
                    children: [
                      pw.Text('CONTENTS OF DETAILED VASTU SOLUTION REPORT', style: pw.TextStyle(fontSize: 16, fontWeight: pw.FontWeight.bold, color: PdfColors.teal)),
                      pw.Divider(color: PdfColors.teal, thickness: 1.5),
                      pw.SizedBox(height: 10),
                      ...[
                        '1. Determination of Direction from Satellite & Centroid',
                        '2. Distribution of 16 Vastu Zones and Five Elements',
                        '3. 32 Entrances Pada Distribution & Evaluation',
                        '4. Distribution of 45 Energy Fields / Devtas Grid',
                        '5. 17 Zones Architectural Activity & Remedies Table',
                        '6. Applied Vastu Zonal Strength Area Graph',
                        '7. Recommended Wall Colors as per Vastu',
                        '8. Wall Colors to Avoid as per Elemental Cycle',
                        '9. Astro-Vastu Dasha & Disha Combinations',
                        '10. Planetary Degrees, Nakshatra & Sub-Lord Table (KP System)',
                        '11. Planet-to-Planet & Planet-to-House Aspect Hits Matrix',
                        '12. Numerology & Loshu Grid Analysis',
                        '13. Basic Interior Positions (Bed, Kitchen, Wardrobe)',
                        '14. Auspicious Indoor Plants Allocation',
                        '15. Modern Electronic Gadgets Placement Guidelines',
                      ].map((item) => pw.Padding(
                        padding: const pw.EdgeInsets.symmetric(vertical: 4),
                        child: pw.Text(item, style: const pw.TextStyle(fontSize: 11)),
                      )),
                    ],
                  ),
                ),
              );

              // 3. FLOOR PLAN OVERLAY WITH 16 ZONES
              pdf.addPage(
                pw.Page(
                  pageFormat: format,
                  build: (pw.Context ctx) => pw.Column(
                    crossAxisAlignment: pw.CrossAxisAlignment.start,
                    children: [
                      pw.Text('16 VASTU ZONES & BRAHMASTHAN CENTROID PLAN', style: pw.TextStyle(fontSize: 15, fontWeight: pw.FontWeight.bold, color: PdfColors.teal)),
                      pw.SizedBox(height: 6),
                      pw.Text('Calculated North Degree Tilt: ${client.northDegree.toInt()}° | Center: Geometric Polygon Centroid'),
                      pw.SizedBox(height: 8),
                      if (mapBytes != null)
                        pw.Center(child: pw.Image(pw.MemoryImage(mapBytes), height: 360)),
                      pw.SizedBox(height: 12),
                      pw.Text('Key Evaluation Points:', style: pw.TextStyle(fontWeight: pw.FontWeight.bold)),
                      pw.Bullet(text: 'Brahmasthan (Red Bullseye) is the epicenter of household vital energy.'),
                      pw.Bullet(text: 'Radial distribution across 16 zones: N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSW, SW, WSW, W, WNW, NW, NNW.'),
                      pw.Bullet(text: 'Entrance analysis conducted across 32 individual energy sectors.'),
                    ],
                  ),
                ),
              );

              // 4. ZONAL STRENGTH BAR CHART (GRAPHICAL BARS)
              pdf.addPage(
                pw.Page(
                  pageFormat: format,
                  build: (pw.Context ctx) {
                    final zones = ['E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW', 'N', 'NNE', 'NE', 'ENE'];
                    final strengths = [0.46, 0.29, 0.35, 1.10, 1.64, 1.58, 1.60, 0.90, 0.50, 0.53, 0.95, 1.05, 1.20, 1.15, 1.42, 1.68];

                    return pw.Column(
                      crossAxisAlignment: pw.CrossAxisAlignment.start,
                      children: [
                        pw.Text('APPLIED VASTU ZONAL STRENGTH GRAPH', style: pw.TextStyle(fontSize: 16, fontWeight: pw.FontWeight.bold, color: PdfColors.teal)),
                        pw.SizedBox(height: 6),
                        pw.Text('Upper Balance Line: 1.34 | Normal Balance Line: 1.00 | Lower Balance Line: 0.65', style: const pw.TextStyle(fontSize: 10, color: PdfColors.grey700)),
                        pw.SizedBox(height: 25),
                        pw.Container(
                          height: 240,
                          padding: const pw.EdgeInsets.all(10),
                          decoration: pw.BoxDecoration(border: pw.Border.all(color: PdfColors.grey400)),
                          child: pw.Row(
                            crossAxisAlignment: pw.CrossAxisAlignment.end,
                            children: List.generate(16, (i) {
                              double val = strengths[i];
                              PdfColor barColor = val < 0.65 ? PdfColors.red : (val > 1.34 ? PdfColors.orange : PdfColors.green);
                              return pw.Expanded(
                                child: pw.Column(
                                  mainAxisAlignment: pw.MainAxisAlignment.end,
                                  children: [
                                    pw.Text(val.toStringAsFixed(2), style: pw.TextStyle(fontSize: 7, color: barColor, fontWeight: pw.FontWeight.bold)),
                                    pw.SizedBox(height: 2),
                                    pw.Container(
                                      height: val * 100,
                                      margin: const pw.EdgeInsets.symmetric(horizontal: 2),
                                      color: barColor,
                                    ),
                                    pw.SizedBox(height: 4),
                                    pw.Text(zones[i], style: const pw.TextStyle(fontSize: 8)),
                                  ],
                                ),
                              );
                            }),
                          ),
                        ),
                        pw.SizedBox(height: 15),
                        pw.Text('Zonal Strength Analysis Summary:', style: pw.TextStyle(fontWeight: pw.FontWeight.bold)),
                        pw.Bullet(text: 'Zones Below Lower Balance Line (Depleted/Cut): E (0.46), ESE (0.29), SE (0.35), W (0.50), WNW (0.53)'),
                        pw.Bullet(text: 'Zones Above Upper Balance Line (Extended): S (1.64), SSW (1.58), SW (1.60), NE (1.42), ENE (1.68)'),
                      ],
                    );
                  },
                ),
              );

              // 5. 17 ZONES ARCHITECTURAL ACTIVITY & EFFECTS TABLE
