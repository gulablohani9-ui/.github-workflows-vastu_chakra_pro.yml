          class _VastuMapEditorState extends State<VastuMapEditor> {
            int? draggedIdx;
            bool isDotMode = false;
            bool showKpChakraLive = true;
            final TransformationController _transController = TransformationController();

            int maxGridFeet = 30;

            double get pixelsPerFoot {
              return 300.0 / maxGridFeet;
            }

            void recalculateDimensionsFromPoints() {
              if (widget.points.length >= 3) {
                double minX = widget.points.map((p) => p.dx).reduce(math.min);
                double maxX = widget.points.map((p) => p.dx).reduce(math.max);
                double minY = widget.points.map((p) => p.dy).reduce(math.min);
                double maxY = widget.points.map((p) => p.dy).reduce(math.max);

                double measuredW = (maxX - minX) / pixelsPerFoot;
                double measuredL = (maxY - minY) / pixelsPerFoot;

                if (measuredW > 2 && measuredL > 2) {
                  widget.client.plotWidth = double.parse(measuredW.toStringAsFixed(1));
                  widget.client.plotLength = double.parse(measuredL.toStringAsFixed(1));
                }
              }
            }

