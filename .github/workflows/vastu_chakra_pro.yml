                              String z = zones[i];
                              double rawArea = areas[z]!;
                              double ratio = rawArea / balance;
                              PdfColor barColor = rawArea < lowerBal ? PdfColors.red : (rawArea > upperBal ? PdfColors.orange : PdfColors.green);

