                    pw.Positioned(left: 8, child: pw.Text('H1: Aries (Asc)', style: pw.TextStyle(fontSize: 7, fontWeight: pw.FontWeight.bold, color: PdfColors.red))),
                    pw.Positioned(right: 8, child: pw.Text('H7: Libra (Sa)', style: const pw.TextStyle(fontSize: 7))),
                    pw.Positioned(top: 35, left: 35, child: pw.Text('H11: Kumbha (Mo)', style: const pw.TextStyle(fontSize: 7))),
                    pw.Positioned(top: 35, right: 35, child: pw.Text('H9: Dhanus (Ke)', style: const pw.TextStyle(fontSize: 7))),
                    pw.Positioned(bottom: 35, left: 35, child: pw.Text('H3: Mithun (Su,Ma,Me,Ra)', style: const pw.TextStyle(fontSize: 6.5))),
                    pw.Positioned(bottom: 35, right: 35, child: pw.Text('H8: Vrischika (Ju)', style: const pw.TextStyle(fontSize: 7))),
                  ],
                ),
              );
            }

            pw.Widget buildVectorMarmasthanSheet(Uint8List? bgMap) {
              return pw.Container(
                width: 380,
                height: 380,
                decoration: pw.BoxDecoration(border: pw.Border.all(color: PdfColors.grey500)),
                child: pw.Stack(
                  alignment: pw.Alignment.center,
                  children: [
                    if (bgMap != null) pw.Image(pw.MemoryImage(bgMap), width: 380, height: 380, fit: pw.BoxFit.contain),
                    // Vector 81-Pada Marmasthan Overlay
                    pw.CustomPaint(
                      size: const PdfPoint(360, 360),
                      painter: (PdfGraphics canvas, PdfPoint size) {
                        final double w = size.x;
                        final double h = size.y;
                        
                        // Diagonal Marma Lines (Shiras, Hridaya, Nabhi)
                        canvas.setColor(PdfColors.white);
                        canvas.setLineWidth(1.2);
                        canvas.drawLine(0, 0, w, h);
                        canvas.strokePath();
                        canvas.drawLine(0, h, w, 0);
                        canvas.strokePath();
                        
                        // Marmasthan Circles (Mahamarma = Red, Upamarma = Green)
                        final redDots = [
                          PdfPoint(w * 0.5, h * 0.5), // Brahma Center
                          PdfPoint(w * 0.38, h * 0.38),
                          PdfPoint(w * 0.62, h * 0.62),
                          PdfPoint(w * 0.38, h * 0.62),
                          PdfPoint(w * 0.62, h * 0.38),
                          PdfPoint(w * 0.22, h * 0.22),
                          PdfPoint(w * 0.78, h * 0.78),
                          PdfPoint(w * 0.22, h * 0.78),
                          PdfPoint(w * 0.78, h * 0.22),
                        ];
                        for (var pt in redDots) {
                          canvas.setColor(PdfColors.redAccent);
                          canvas.drawEllipse(pt.x, pt.y, 6.5, 6.5);
                          canvas.fillAndStrokePath();
                        }

                        final greenDots = [
                          PdfPoint(w * 0.28, h * 0.18),
                          PdfPoint(w * 0.72, h * 0.18),
                          PdfPoint(w * 0.28, h * 0.82),
                          PdfPoint(w * 0.72, h * 0.82),
                          PdfPoint(w * 0.18, h * 0.38),
                          PdfPoint(w * 0.82, h * 0.38),
                          PdfPoint(w * 0.18, h * 0.62),
                          PdfPoint(w * 0.82, h * 0.62),
                        ];
                        for (var pt in greenDots) {
                          canvas.setColor(PdfColors.greenAccent);
                          canvas.drawEllipse(pt.x, pt.y, 6.0, 6.0);
                          canvas.fillAndStrokePath();
                        }
                      },
                    ),
                    // Centered Brahma Label
                    pw.Text('BRAHMA (MARMA)', style: pw.TextStyle(fontSize: 10, fontWeight: pw.FontWeight.bold, color: PdfColors.amber)),
                    pw.Positioned(top: 15, child: pw.Text('BHUDHAR', style: pw.TextStyle(fontSize: 8, fontWeight: pw.FontWeight.bold, color: PdfColors.white))),
                    pw.Positioned(bottom: 15, child: pw.Text('VIVISWAN', style: pw.TextStyle(fontSize: 8, fontWeight: pw.FontWeight.bold, color: PdfColors.white))),
                    pw.Positioned(left: 15, child: pw.Text('MITRA', style: pw.TextStyle(fontSize: 8, fontWeight: pw.FontWeight.bold, color: PdfColors.white))),
                    pw.Positioned(right: 15, child: pw.Text('ARYAMA', style: pw.TextStyle(fontSize: 8, fontWeight: pw.FontWeight.bold, color: PdfColors.white))),
                  ],
                ),
              );
            }

            Future<Uint8List> generateFullReport(PdfPageFormat format) async {
              final pdf = pw.Document();
              Uint8List? mapBytes;
              try {
                mapBytes = await screenshotController.capture();
              } catch (_) {}

              // 1. COVER PAGE
              pdf.addPage(
                pw.Page(
                  pageFormat: format,
                  build: (pw.Context ctx) => pw.Container(
                    padding: const pw.EdgeInsets.all(20),
                    child: pw.Column(
                      crossAxisAlignment: pw.CrossAxisAlignment.center,
                      mainAxisAlignment: pw.MainAxisAlignment.spaceBetween,
                      children: [
                        pw.Container(
                          padding: const pw.EdgeInsets.symmetric(vertical: 6, horizontal: 16),
                          decoration: pw.BoxDecoration(border: pw.Border.all(color: PdfColors.teal, width: 2)),
                          child: pw.Text('VASTU EVALUATION REPORT', style: pw.TextStyle(fontSize: 20, fontWeight: pw.FontWeight.bold, color: PdfColors.teal)),
                        ),
                        pw.Text('FOR HOME - FLAT - APARTMENTS - COMMERCIAL', style: pw.TextStyle(fontSize: 11, color: PdfColors.grey700, fontWeight: pw.FontWeight.bold)),
                        pw.SizedBox(height: 10),
                        pw.Container(
                          width: 200,
                          height: 200,
                          decoration: pw.BoxDecoration(shape: pw.BoxShape.circle, border: pw.Border.all(color: PdfColors.amber800, width: 3)),
                          child: pw.Center(
                            child: pw.Column(
                              mainAxisAlignment: pw.MainAxisAlignment.center,
                              children: [
                                pw.Text('Ether (Space)', style: pw.TextStyle(fontSize: 12, fontWeight: pw.FontWeight.bold, color: PdfColors.amber800)),
                                pw.Text('Air | Fire | Water | Earth', style: const pw.TextStyle(fontSize: 9, color: PdfColors.grey700)),
                                pw.SizedBox(height: 4),
                                pw.Text('VASTU PURUSHA MANDALA', style: pw.TextStyle(fontSize: 8, fontWeight: pw.FontWeight.bold)),
                              ],
                            ),
                          ),
                        ),
                        pw.SizedBox(height: 10),
                        pw.Container(
                          padding: const pw.EdgeInsets.all(10),
                          decoration: pw.BoxDecoration(border: pw.Border.all(color: PdfColors.teal), color: PdfColors.grey100),
                          child: pw.Column(
                            crossAxisAlignment: pw.CrossAxisAlignment.start,
                            children: [
                              pw.Text('CLIENT NAME: ${client.name.toUpperCase()}', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 12)),
                              pw.Text('ADDRESS: ${client.address}', style: const pw.TextStyle(fontSize: 10)),
                              pw.Text('PROPERTY TYPE: [ ${client.propertyType} ]', style: const pw.TextStyle(fontSize: 10)),
                              pw.Text('EVALUATION DATE: ${DateFormat('dd/MM/yyyy').format(DateTime.now())}', style: const pw.TextStyle(fontSize: 10)),
                              pw.Text('NORTH DEGREE TILT: ${client.northDegree.toInt()}° Toward West/East', style: const pw.TextStyle(fontSize: 10)),
                            ],
                          ),
                        ),
                        pw.SizedBox(height: 6),
                        pw.Text('AppliedVastu® - ACCURATE COMBINATION OF DASHA & DISHA', style: pw.TextStyle(fontSize: 12, fontWeight: pw.FontWeight.bold, color: PdfColors.teal)),
                        pw.Text('Comprehensive 16 Zones, 32 Padas, 45 Devtas, and Astro-Vastu Evaluation', style: const pw.TextStyle(fontSize: 8, color: PdfColors.grey600)),
                      ],
                    ),
                  ),
                ),
              );

              // 2. SIX STEPS CONSULTANCY
              pdf.addPage(
                pw.Page(
                  pageFormat: format,
                  build: (pw.Context ctx) => pw.Column(
                    crossAxisAlignment: pw.CrossAxisAlignment.start,
