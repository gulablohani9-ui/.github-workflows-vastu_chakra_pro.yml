          class PlotPolygonPainter extends CustomPainter {
            final List<Offset> points;
            PlotPolygonPainter({required this.points});

            @override
            void paint(Canvas canvas, Size size) {
              if (points.isEmpty) return;
              final borderPaint = Paint()..color = Colors.amberAccent..strokeWidth = 2.0..style = PaintingStyle.stroke;
              final dotPaint = Paint()..color = Colors.redAccent;

              Path path = Path()..moveTo(points[0].dx, points[0].dy);
              for (int i = 1; i < points.length; i++) {
                path.lineTo(points[i].dx, points[i].dy);
              }
              if (points.length >= 3) {
                path.close();
                canvas.drawPath(path, Paint()..color = Colors.amber.withOpacity(0.2)..style = PaintingStyle.fill);
                canvas.drawPath(path, borderPaint);
              }

              for (var p in points) {
                canvas.drawCircle(p, 8, dotPaint);
                canvas.drawCircle(p, 3, Paint()..color = Colors.white);
              }
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }

          class PdfReportPreviewScreen extends StatelessWidget {
            final MasterClientData client;
            final Uint8List? mapImageBytes;

            const PdfReportPreviewScreen({
              super.key,
              required this.client,
              required this.mapImageBytes,
            });

            Future<Uint8List?> _loadAssetBytes(String path) async {
              try {
                final data = await rootBundle.load(path);
                return data.buffer.asUint8List();
              } catch (_) {
                return null;
              }
            }

