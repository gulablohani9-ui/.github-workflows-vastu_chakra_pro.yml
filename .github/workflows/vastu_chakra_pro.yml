          // GLOBAL TOP-LEVEL EXCEL ENGINE (FIXES SCOPE ERROR)
          Map<String, dynamic> calculateExcelZonalStrength(double width, double length, double northDeg, Map<String, double> manualMap) {
            double w = width / 2.0;
            double l = length / 2.0;
            double wl2 = w * l / 2.0;
            double a = (w * w) / 2.0;
            double b = (l * l) / 2.0;
            double diag = math.atan(l / w) * 180.0 / math.pi;

            final zonesOrder = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
            Map<String, double> areas = {};

            double currD = northDeg + 11.25;

            for (String z in zonesOrder) {
              if (manualMap.containsKey(z)) {
                areas[z] = manualMap[z]!;
                continue;
              }

              double d = currD % 360.0;
              if (d < 0) d += 360.0;
              double e = (d - 22.5) % 360.0;
              if (e < 0) e += 360.0;

              bool c1 = ((d <= diag || d >= 360.0 - diag) && (e <= diag || e >= 360.0 - diag)) ||
                  ((d <= (180.0 + diag) % 360.0 && d >= (180.0 - diag) % 360.0) && (e <= (180.0 + diag) % 360.0 && e >= (180.0 - diag) % 360.0));

              bool c2 = ((d <= (180.0 - diag) && d >= diag) && (e <= (180.0 - diag) && e >= diag)) ||
                  ((d <= (360.0 - diag) && d >= (180.0 + diag)) && (e <= (360.0 - diag) && e >= (180.0 + diag)));

              bool c3 = (e <= diag && d >= diag && d < 90.0) ||
                  (e <= (180.0 + diag) && e > 180.0 && d >= (180.0 + diag) && d < 270.0);

              bool c4 = (e <= (180.0 - diag) && e > 90.0 && d >= (180.0 - diag) && d < 180.0) ||
                  (e <= (360.0 - diag) && e > 270.0 && d >= (360.0 - diag) && d < 360.0);

              double dRad = d * math.pi / 180.0;
              double eRad = e * math.pi / 180.0;

              double mVal = a * math.tan(dRad) - a * math.tan(eRad);
              double nVal = b * math.tan((d - 90.0) * math.pi / 180.0) + b * math.tan((90.0 - e) * math.pi / 180.0);
              double oVal = wl2 - a * math.tan(eRad) + wl2 - b * math.tan((90.0 - d) * math.pi / 180.0);
              double pVal = wl2 - a * math.tan((180.0 - d) * math.pi / 180.0) + wl2 - b * math.tan((e - 90.0) * math.pi / 180.0);

              double areaVal = wl2;
              if (c1) areaVal = mVal.abs();
              else if (c2) areaVal = nVal.abs();
              else if (c3) areaVal = oVal.abs();
              else if (c4) areaVal = pVal.abs();

              areas[z] = areaVal;
              currD = e;
            }

            double sumArea = areas.values.reduce((v1, v2) => v1 + v2);
            double balance = sumArea / 16.0;
            double maxVal = areas.values.reduce(math.max);
            double minVal = areas.values.reduce(math.min);

            double upperBal = (maxVal - balance) / 2.0 + balance;
            double lowerBal = (balance - minVal) / 2.0 + minVal;

            return {
              'areas': areas,
              'balance': balance,
              'upperBal': upperBal,
              'lowerBal': lowerBal,
              'zones': zonesOrder,
            };
          }

          class MainMasterDashboard extends StatefulWidget {
            const MainMasterDashboard({super.key});

            @override
            State<MainMasterDashboard> createState() => _MainMasterDashboardState();
          }

          class _MainMasterDashboardState extends State<MainMasterDashboard> {
            final MasterClientData client = MasterClientData();
            File? mapImage;
            Uint8List? mapImageBytes;
            List<Offset> plotPoints = [];
            int currentTab = 0;

            Offset? getCentroid(List<Offset> pts) {
              if (pts.length < 3) return null;
              double area = 0.0, cx = 0.0, cy = 0.0;
              for (int i = 0; i < pts.length; i++) {
                int j = (i + 1) % pts.length;
                double factor = (pts[i].dx * pts[j].dy) - (pts[j].dx * pts[i].dy);
                area += factor;
                cx += (pts[i].dx + pts[j].dx) * factor;
                cy += (pts[i].dy + pts[j].dy) * factor;
              }
              area *= 0.5;
              if (area.abs() < 0.001) return null;
              return Offset(cx / (6 * area), cy / (6 * area));
            }

            @override
            Widget build(BuildContext context) {
              Offset? centroid = getCentroid(plotPoints);

              final screens = [
                ClientInputScreen(client: client, onUpdate: () => setState(() {})),
                VastuMapEditor(
                  client: client,
                  mapImage: mapImage,
                  points: plotPoints,
                  centroid: centroid,
                  northDegree: client.northDegree,
                  onPickImage: (f, b) => setState(() {
                    mapImage = f;
                    mapImageBytes = b;
                  }),
                  onPointsUpdate: (pts) => setState(() => plotPoints = pts),
                  onDegreeChanged: (deg) => setState(() => client.northDegree = deg),
                ),
                ZonalAreaEditorScreen(client: client, onUpdate: () => setState(() {})),
                AstroCalculationsScreen(client: client),
                PdfReportPreviewScreen(
                  client: client,
                  mapImageBytes: mapImageBytes,
                  points: plotPoints,
                  centroid: centroid,
                ),
              ];

              return Scaffold(
                body: screens[currentTab],
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: currentTab,
                  selectedItemColor: Colors.tealAccent,
                  unselectedItemColor: Colors.grey,
                  backgroundColor: const Color(0xFF1E1E1E),
                  type: BottomNavigationBarType.fixed,
                  onTap: (idx) => setState(() => currentTab = idx),
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.person), label: 'Client / Place'),
                    BottomNavigationBarItem(icon: Icon(Icons.architecture), label: 'Ruler & Map'),
                    BottomNavigationBarItem(icon: Icon(Icons.bar_chart), label: 'Plot & Graph'),
                    BottomNavigationBarItem(icon: Icon(Icons.auto_awesome), label: 'Astro-KP'),
                    BottomNavigationBarItem(icon: Icon(Icons.picture_as_pdf), label: 'Glohani PDF'),
                  ],
                ),
              );
