name: Build AstroVastu Report Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Generate AstroVastu Report Suite
        run: |
          rm -rf lib android
          flutter create --template=app --org=com.astro.vastureport --project-name=astrovastu_report_pro . --overwrite
          
          cat << 'EOF' > pubspec.yaml
          name: astrovastu_report_pro
          description: Professional Astro-Vastu Full Evaluation Report Generator
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            image_picker: ^1.0.7
            screenshot: ^2.1.0
            path_provider: ^2.1.2
            share_plus: ^7.2.2
            pdf: ^3.10.7
            printing: ^5.11.1
            intl: ^0.19.0

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          EOF

          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'dart:math' as math;
          import 'dart:typed_data';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:screenshot/screenshot.dart';
          import 'package:pdf/pdf.dart';
          import 'package:pdf/widgets.dart' as pw;
          import 'package:printing/printing.dart';
          import 'package:intl/intl.dart';

          void main() {
            runApp(const AstroVastuApp());
          }

          class AstroVastuApp extends StatelessWidget {
            const AstroVastuApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'AstroVastu Report Pro',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF121212),
                  primaryColor: Colors.tealAccent,
                  colorScheme: const ColorScheme.dark(
                    primary: Colors.tealAccent,
                    surface: Color(0xFF1E1E1E),
                  ),
                ),
                home: const MainDashboard(),
              );
            }
          }

          class ClientData {
            String name = "PXXXX XXXXXXR";
            String propertyType = "FLAT";
            String address = "New Delhi, India";
            DateTime dob = DateTime(1988, 9, 7);
            TimeOfDay birthTime = const TimeOfDay(hour: 6, minute: 22);
            String birthPlace = "Delhi, NCT, India";
            double northDegree = 15.0;
          }

          class MainDashboard extends StatefulWidget {
            const MainDashboard({super.key});

            @override
            State<MainDashboard> createState() => _MainDashboardState();
          }

          class _MainDashboardState extends State<MainDashboard> {
            final ClientData client = ClientData();
            File? mapImage;
            List<Offset> plotPoints = [];
            final ScreenshotController screenshotController = ScreenshotController();
            int currentTab = 0;

            Offset? getCentroid(List<Offset> pts) {
              if (pts.length < 3) return null;
              double area = 0.0, cx = 0.0, cy = 0.0;
              for (int i = 0; i < pts.length; i++) {
                int j = (i + 1) % pts.length;
                double factor = (pts[i].dx * pts[j].dy) - (pts[j].dx * pts[i].dy);
                area += factor;
                cx += (pts[i].dx + pts[j].dx) * factor;
                cy += (pts[i].dy + pts[j].dy) * factor;
              }
              area *= 0.5;
              if (area.abs() < 0.001) return null;
              return Offset(cx / (6 * area), cy / (6 * area));
            }

            @override
            Widget build(BuildContext context) {
              Offset? centroid = getCentroid(plotPoints);

              final screens = [
                ClientInputScreen(
                  client: client,
                  onUpdate: () => setState(() {}),
                ),
                VastuMapEditor(
                  mapImage: mapImage,
                  points: plotPoints,
                  centroid: centroid,
                  northDegree: client.northDegree,
                  screenshotController: screenshotController,
                  onPickImage: (f) => setState(() => mapImage = f),
                  onPointsUpdate: (pts) => setState(() => plotPoints = pts),
                  onDegreeChanged: (deg) => setState(() => client.northDegree = deg),
                ),
                AstroCalculationsScreen(client: client),
                PdfReportPreviewScreen(
                  client: client,
                  mapImage: mapImage,
                  points: plotPoints,
                  centroid: centroid,
                  screenshotController: screenshotController,
                ),
              ];

              return Scaffold(
                body: screens[currentTab],
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: currentTab,
                  selectedItemColor: Colors.tealAccent,
                  unselectedItemColor: Colors.grey,
                  backgroundColor: const Color(0xFF1E1E1E),
                  type: BottomNavigationBarType.fixed,
                  onTap: (idx) => setState(() => currentTab = idx),
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.person), label: 'Client / DOB'),
                    BottomNavigationBarItem(icon: Icon(Icons.architecture), label: 'Map & Degree'),
                    BottomNavigationBarItem(icon: Icon(Icons.auto_awesome), label: 'Astro-Vastu'),
                    BottomNavigationBarItem(icon: Icon(Icons.picture_as_pdf), label: 'Generate PDF'),
                  ],
                ),
              );
            }
          }

          // SCREEN 1: CLIENT DETAILS & DOB INPUT
          class ClientInputScreen extends StatelessWidget {
            final ClientData client;
            final VoidCallback onUpdate;
            const ClientInputScreen({super.key, required this.client, required this.onUpdate});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Client & Astro Details'), centerTitle: true),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    TextFormField(
                      initialValue: client.name,
                      decoration: const InputDecoration(labelText: 'Client Name', border: OutlineInputBorder()),
                      onChanged: (v) { client.name = v; onUpdate(); },
                    ),
                    const SizedBox(height: 12),
                    TextFormField(
                      initialValue: client.address,
                      decoration: const InputDecoration(labelText: 'Property Address', border: OutlineInputBorder()),
                      onChanged: (v) { client.address = v; onUpdate(); },
                    ),
                    const SizedBox(height: 12),
                    DropdownButtonFormField<String>(
                      value: client.propertyType,
                      decoration: const InputDecoration(labelText: 'Property Type', border: OutlineInputBorder()),
                      items: ['FLAT', 'HOME', 'OFFICE', 'LAND', 'COMMERCIAL', 'FACTORY']
                          .map((e) => DropdownMenuItem(value: e, child: Text(e)))
                          .toList(),
                      onChanged: (v) { if (v != null) { client.propertyType = v; onUpdate(); } },
                    ),
                    const SizedBox(height: 16),
                    const Text('Birth Information (For Astro-Vastu Alignment)', style: TextStyle(color: Colors.tealAccent, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 10),
                    ListTile(
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8), side: const BorderSide(color: Colors.white24)),
                      title: Text('DOB: ${DateFormat('dd-MM-yyyy').format(client.dob)}'),
                      trailing: const Icon(Icons.calendar_today, color: Colors.tealAccent),
                      onTap: () async {
                        DateTime? d = await showDatePicker(
                          context: context,
                          initialDate: client.dob,
                          firstDate: DateTime(1940),
                          lastDate: DateTime(2035),
                        );
                        if (d != null) { client.dob = d; onUpdate(); }
                      },
                    ),
                    const SizedBox(height: 10),
                    ListTile(
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8), side: const BorderSide(color: Colors.white24)),
                      title: Text('Birth Time: ${client.birthTime.format(context)}'),
                      trailing: const Icon(Icons.access_time, color: Colors.tealAccent),
                      onTap: () async {
                        TimeOfDay? t = await showTimePicker(context: context, initialTime: client.birthTime);
                        if (t != null) { client.birthTime = t; onUpdate(); }
                      },
                    ),
                    const SizedBox(height: 12),
                    TextFormField(
                      initialValue: client.birthPlace,
                      decoration: const InputDecoration(labelText: 'Birth Place', border: OutlineInputBorder()),
                      onChanged: (v) { client.birthPlace = v; onUpdate(); },
                    ),
                  ],
                ),
              );
            }
          }

          // SCREEN 2: INTERACTIVE MAP EDITOR WITH DRAGGABLE DOTS
          class VastuMapEditor extends StatefulWidget {
            final File? mapImage;
            final List<Offset> points;
            final Offset? centroid;
            final double northDegree;
            final ScreenshotController screenshotController;
            final Function(File) onPickImage;
            final Function(List<Offset>) onPointsUpdate;
            final Function(double) onDegreeChanged;

            const VastuMapEditor({
              super.key,
              required this.mapImage,
              required this.points,
              required this.centroid,
              required this.northDegree,
              required this.screenshotController,
              required this.onPickImage,
              required this.onPointsUpdate,
              required this.onDegreeChanged,
            });

            @override
            State<VastuMapEditor> createState() => _VastuMapEditorState();
          }

          class _VastuMapEditorState extends State<VastuMapEditor> {
            int? draggedIdx;

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Plot Boundary & Centroid'),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.photo),
                      onPressed: () async {
                        final p = await ImagePicker().pickImage(source: ImageSource.gallery);
                        if (p != null) widget.onPickImage(File(p.path));
                      },
                    ),
                    IconButton(
                      icon: const Icon(Icons.refresh, color: Colors.redAccent),
                      onPressed: () => widget.onPointsUpdate([]),
                    )
                  ],
                ),
                body: Column(
                  children: [
                    Expanded(
                      child: Screenshot(
                        controller: widget.screenshotController,
                        child: GestureDetector(
                          onPanDown: (d) {
                            for (int i = 0; i < widget.points.length; i++) {
                              if ((widget.points[i] - d.localPosition).distance < 25) {
                                draggedIdx = i;
                                return;
                              }
                            }
                            List<Offset> up = List.from(widget.points)..add(d.localPosition);
                            widget.onPointsUpdate(up);
                          },
                          onPanUpdate: (d) {
                            if (draggedIdx != null) {
                              List<Offset> up = List.from(widget.points);
                              up[draggedIdx!] = d.localPosition;
                              widget.onPointsUpdate(up);
                            }
                          },
                          onPanEnd: (_) => draggedIdx = null,
                          child: Stack(
                            fit: StackFit.expand,
                            children: [
                              Container(
                                color: Colors.black,
                                child: widget.mapImage != null
                                    ? Image.file(widget.mapImage!, fit: BoxFit.contain)
                                    : const Center(child: Text('Tap Gallery icon above to upload floor plan\nTap corners to set boundary dots', textAlign: TextAlign.center)),
                              ),
                              CustomPaint(
                                painter: ReportVastuPainter(
                                  points: widget.points,
                                  centroid: widget.centroid,
                                  northDegree: widget.northDegree,
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                    Container(
                      color: const Color(0xFF1E1E1E),
                      padding: const EdgeInsets.all(12),
                      child: Row(
                        children: [
                          const Text('North Degree: ', style: TextStyle(color: Colors.tealAccent, fontWeight: FontWeight.bold)),
                          Expanded(
                            child: Slider(
                              value: widget.northDegree,
                              min: 0,
                              max: 360,
                              onChanged: widget.onDegreeChanged,
                            ),
                          ),
                          Text('${widget.northDegree.toInt()}°', style: const TextStyle(fontWeight: FontWeight.bold)),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          // SCREEN 3: ASTRO-VASTU & NUMEROLOGY ENGINE CALCULATION
          class AstroCalculationsScreen extends StatelessWidget {
            final ClientData client;
            const AstroCalculationsScreen({super.key, required this.client});

            int calcMulank(DateTime dt) {
              int d = dt.day;
              return d > 9 ? (d ~/ 10 + d % 10) : d;
            }

            int calcBhagyank(DateTime dt) {
              int sum = dt.day + dt.month + dt.year;
              while (sum > 9) {
                int temp = 0;
                while (sum > 0) { temp += sum % 10; sum ~/= 10; }
                sum = temp;
              }
              return sum;
            }

            @override
            Widget build(BuildContext context) {
              int mulank = calcMulank(client.dob);
              int bhagyank = calcBhagyank(client.dob);

              return Scaffold(
                appBar: AppBar(title: const Text('Astro-Vastu & Numerology Matrix'), centerTitle: true),
                body: ListView(
                  padding: const EdgeInsets.all(14),
                  children: [
                    Card(
                      child: Padding(
                        padding: const EdgeInsets.all(12.0),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text('Numerology (Loshu Grid Basis)', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.tealAccent)),
                            const SizedBox(height: 6),
                            Text('• Psychic Number (Mulank): $mulank'),
                            Text('• Destiny Number (Bhagyank): $bhagyank'),
                            Text('• Friendly Numbers: 1, 5, 6 | Neutral: 3, 7'),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 10),
                    Card(
                      child: Padding(
                        padding: const EdgeInsets.all(12.0),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: const [
                            Text('16 Vastu Zones & Connected Life Areas', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.tealAccent)),
                            SizedBox(height: 6),
                            Text('• North: Opportunities, Treasury, Liquid Cash'),
                            Text('• North-East (NE): Clarity of Mind, Health Immunity'),
                            Text('• East: Social Connectivity, Fame, Recognition'),
                            Text('• South-East (SE): Fire, Cash Liquidity, Digestion'),
                            Text('• South: Rest, Relaxation, Legal Victory'),
                            Text('• South-West (SW): Skills, Relationship, Stability'),
                            Text('• West: Gains, Profits, Realized Wealth'),
                            Text('• North-West (NW): Banking Support, Relatives & Allies'),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          // SCREEN 4: FULL REPORT PDF EXPORT & PREVIEW
          class PdfReportPreviewScreen extends StatelessWidget {
            final ClientData client;
            final File? mapImage;
            final List<Offset> points;
            final Offset? centroid;
            final ScreenshotController screenshotController;

            const PdfReportPreviewScreen({
              super.key,
              required this.client,
              required this.mapImage,
              required this.points,
              required this.centroid,
              required this.screenshotController,
            });

            Future<Uint8List> generateFullReport(PdfPageFormat format) async {
              final pdf = pw.Document();
              Uint8List? mapBytes;
              try {
                mapBytes = await screenshotController.capture();
              } catch (_) {}

              // PAGE 1: COVER PAGE
              pdf.addPage(
                pw.Page(
                  pageFormat: format,
                  build: (pw.Context ctx) => pw.Container(
                    padding: const pw.EdgeInsets.all(20),
                    child: pw.Column(
                      crossAxisAlignment: pw.CrossAxisAlignment.center,
                      mainAxisAlignment: pw.MainAxisAlignment.spaceBetween,
                      children: [
                        pw.Text('VASTU EVALUATION REPORT', style: pw.TextStyle(fontSize: 24, fontWeight: pw.FontWeight.bold, color: PdfColors.teal)),
                        pw.Text('FOR HOME - FLAT - COMMERCIAL SPACE', style: pw.TextStyle(fontSize: 14, color: PdfColors.grey700)),
                        pw.SizedBox(height: 20),
                        pw.Container(
                          padding: const pw.EdgeInsets.all(15),
                          decoration: pw.BoxDecoration(border: pw.Border.all(color: PdfColors.teal, width: 2)),
                          child: pw.Column(
                            crossAxisAlignment: pw.CrossAxisAlignment.start,
                            children: [
                              pw.Text('CLIENT NAME: ${client.name}', style: pw.TextStyle(fontWeight: pw.FontWeight.bold, fontSize: 14)),
                              pw.Text('ADDRESS: ${client.address}'),
                              pw.Text('PROPERTY TYPE: [ ${client.propertyType} ]'),
                              pw.Text('EVALUATION DATE: ${DateFormat('dd/MM/yyyy').format(DateTime.now())}'),
                              pw.Text('NORTH ANGLE: ${client.northDegree.toInt()}° Tilt'),
                            ],
                          ),
                        ),
                        pw.SizedBox(height: 20),
                        pw.Text('ACCURATE COMBINATION OF DASHA & DISHA', style: pw.TextStyle(fontSize: 12, fontStyle: pw.FontStyle.italic)),
                        pw.Text('Comprehensive 16 Zones, 32 Padas, 45 Devtas, and Astro-Vastu Remedies Report', style: const pw.TextStyle(fontSize: 10, color: PdfColors.grey600)),
                      ],
                    ),
                  ),
                ),
              );

              // PAGE 2: MAP WITH 16 ZONES & DEVTA OVERLAY
              pdf.addPage(
                pw.Page(
                  pageFormat: format,
                  build: (pw.Context ctx) => pw.Column(
                    crossAxisAlignment: pw.CrossAxisAlignment.start,
                    children: [
                      pw.Text('16 VASTU ZONES & BRAHMASTHAN CENTROID PLAN', style: pw.TextStyle(fontSize: 16, fontWeight: pw.FontWeight.bold)),
                      pw.SizedBox(height: 8),
                      pw.Text('North Degree Tilt: ${client.northDegree.toInt()}° | Center: Geometric Polygon Centroid'),
                      pw.SizedBox(height: 10),
                      if (mapBytes != null)
                        pw.Center(child: pw.Image(pw.MemoryImage(mapBytes), height: 320)),
                      pw.SizedBox(height: 15),
                      pw.Text('Key Evaluation Points:', style: pw.TextStyle(fontWeight: pw.FontWeight.bold)),
                      pw.Bullet(text: 'Center Point (Brahmasthan) marked at Red Bullseye.'),
                      pw.Bullet(text: '16 Energy zones distributed radially at 22.5° angular sectors.'),
                      pw.Bullet(text: 'Entrance analysis conducted per 32 Pada system.'),
                    ],
                  ),
                ),
              );

              // PAGE 3: 17 ZONES EVALUATION TABLE
              pdf.addPage(
                pw.Page(
                  pageFormat: format,
                  build: (pw.Context ctx) => pw.Column(
                    crossAxisAlignment: pw.CrossAxisAlignment.start,
                    children: [
                      pw.Text('17 ZONES ARCHITECTURAL ACTIVITY & EFFECTS', style: pw.TextStyle(fontSize: 16, fontWeight: pw.FontWeight.bold)),
                      pw.SizedBox(height: 10),
                      pw.Table.fromTextArray(
                        headers: ['Zone', 'Architectural Activity', 'Vastu Effect', 'Status'],
                        data: [
                          ['North', 'Main Entry / Living Room', 'Wealth & Cash Flow', 'Auspicious'],
                          ['NNE', 'Balcony / Dining', 'Health & Immunity', 'Good'],
                          ['NE', 'Pooja Area / Meditation', 'Divine Clarity & Wisdom', 'Best'],
                          ['ENE', 'Open Area / Drawing', 'Recreation & Fun', 'Auspicious'],
                          ['East', 'Balcony / Living', 'Social Connectivity', 'Good'],
                          ['ESE', 'Kitchen (Mixer Grinder)', 'Anxiety & Overthinking', 'Neutral'],
                          ['SE', 'Kitchen Fire Stove', 'Cash Flow & Digestion', 'Auspicious'],
                          ['SSE', 'Exercise / Gymnasium', 'Power & Confidence', 'Good'],
                          ['South', 'Master Bedroom', 'Relaxation & Fame', 'Auspicious'],
                          ['SSW', 'Toilet / Disposal', 'Disposal of Waste', 'Ideal'],
                          ['SW', 'Master Bed Headboard', 'Relationship & Stability', 'Auspicious'],
                          ['WSW', 'Study Table / Books', 'Knowledge & Education', 'Auspicious'],
                          ['West', 'Dining Room / Safe', 'Profits & Manifestation', 'Auspicious'],
                          ['WNW', 'Washing Machine', 'Depression Release', 'Okay'],
                          ['NW', 'Guest Bedroom', 'Support & Banking', 'Good'],
                          ['NNW', 'Dressing Room', 'Attraction & Charm', 'Good'],
                          ['Centre', 'Open Brahmasthan', 'Holistic Balance', 'Auspicious'],
                        ],
                        headerStyle: pw.TextStyle(fontWeight: pw.FontWeight.bold, color: PdfColors.white),
                        headerDecoration: const pw.BoxDecoration(color: PdfColors.teal),
                        cellHeight: 20,
                        cellStyle: const pw.TextStyle(fontSize: 9),
                      ),
                    ],
                  ),
                ),
              );

              // PAGE 4: ASTRO-VASTU & DASHA DISHA INTEGRATION
              pdf.addPage(
                pw.Page(
                  pageFormat: format,
                  build: (pw.Context ctx) => pw.Column(
                    crossAxisAlignment: pw.CrossAxisAlignment.start,
                    children: [
                      pw.Text('APPLIED VASTU - DASHA & DISHA COMBINATIONS', style: pw.TextStyle(fontSize: 16, fontWeight: pw.FontWeight.bold)),
                      pw.SizedBox(height: 10),
                      pw.Container(
                        padding: const pw.EdgeInsets.all(10),
                        decoration: pw.BoxDecoration(color: PdfColors.grey100, border: pw.Border.all(color: PdfColors.grey400)),
                        child: pw.Row(
                          mainAxisAlignment: pw.MainAxisAlignment.spaceBetween,
                          children: [
                            pw.Text('DOB: ${DateFormat('dd/MM/yyyy').format(client.dob)}'),
                            pw.Text('Birth Time: ${client.birthTime.format(ctx)}'),
                            pw.Text('Place: ${client.birthPlace}'),
                          ],
                        ),
                      ),
                      pw.SizedBox(height: 15),
                      pw.Text('Client Astro-Vastu House Placements:'),
                      pw.Bullet(text: 'Lagna & Sun connected to East / North-East energy zones.'),
                      pw.Bullet(text: 'Jupiter alignment supports West & North-East stability.'),
                      pw.Bullet(text: 'Saturn & Rahu zones require balanced neutral elemental colors.'),
                      pw.SizedBox(height: 15),
                      pw.Text('Recommended Remedial Actions:'),
                      pw.Bullet(text: 'Color Balancing: Avoid Red in North & Water Blue in South-East.'),
                      pw.Bullet(text: 'Indoor Plants: Place Lucky Bamboo / Money Plant in North & East.'),
                      pw.Bullet(text: 'Electronic Gadgets: Place Wi-Fi router & music system in NW/SE.'),
                    ],
                  ),
                ),
              );

              return pdf.save();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Evaluation Report PDF'), centerTitle: true),
                body: PdfPreview(
                  build: (format) => generateFullReport(format),
                  canChangeOrientation: false,
                  canChangePageFormat: false,
                ),
              );
            }
          }

          // CUSTOM PAINTER RENDERING 16 ZONES & BRAHMASTHAN
          class ReportVastuPainter extends CustomPainter {
            final List<Offset> points;
            final Offset? centroid;
            final double northDegree;

            ReportVastuPainter({required this.points, required this.centroid, required this.northDegree});

            static const List<String> dir16 = [
              'N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE',
              'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'
            ];

            @override
            void paint(Canvas canvas, Size size) {
              final dotPaint = Paint()..color = Colors.amberAccent;
              final borderPaint = Paint()..color = Colors.tealAccent..strokeWidth = 2.0..style = PaintingStyle.stroke;
              final centroidPaint = Paint()..color = Colors.redAccent;

              if (points.isNotEmpty) {
                Path path = Path()..moveTo(points[0].dx, points[0].dy);
                for (int i = 0; i < points.length; i++) {
                  canvas.drawCircle(points[i], 6, dotPaint);
                  if (i > 0) path.lineTo(points[i].dx, points[i].dy);
                }
                if (points.length >= 3) {
                  path.close();
                  canvas.drawPath(path, borderPaint);
                }
              }

              if (centroid != null) {
                canvas.drawCircle(centroid!, 7, centroidPaint);
                double radius = 170.0;
                double step = 360.0 / 16.0;
                double offsetRad = (northDegree - 90) * (math.pi / 180.0);

                for (int i = 0; i < 16; i++) {
                  double angle = (i * step) * (math.pi / 180.0) + offsetRad;
                  Offset end = Offset(centroid!.dx + radius * math.cos(angle), centroid!.dy + radius * math.sin(angle));
                  canvas.drawLine(centroid!, end, Paint()..color = Colors.amberAccent.withOpacity(0.4)..strokeWidth = 1.0);

                  Offset textPos = Offset(centroid!.dx + (radius + 14) * math.cos(angle), centroid!.dy + (radius + 14) * math.sin(angle));
                  TextPainter tp = TextPainter(
                    text: TextSpan(text: dir16[i], style: const TextStyle(color: Colors.amberAccent, fontSize: 10, fontWeight: FontWeight.bold)),
                    textDirection: TextDirection.ltr,
                  )..layout();
                  tp.paint(canvas, textPos - Offset(tp.width / 2, tp.height / 2));
                }
              }
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }
          EOF

      - name: Force Update Android Manifest with Permissions
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.astro.vastureport">
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
             <application
                  android:label="AstroVastu Report Pro"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        run: |
          mkdir -p artifact_dir
          cp build/app/outputs/flutter-apk/app-release.apk artifact_dir/AstroVastu-Report-Pro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AstroVastu-Report-Pro
          path: artifact_dir/AstroVastu-Report-Pro.apk
