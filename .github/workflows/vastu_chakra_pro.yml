                      pw.Text('Contact & Correspondence:', style: pw.TextStyle(fontWeight: pw.FontWeight.bold)),
                      pw.Text('Glohani Vastu Center, Budherhat Rd, Kolkata-700094\nPhone: +91-8777614891 | Email: info@glohanivastu.com', textAlign: pw.TextAlign.center, style: const pw.TextStyle(fontSize: 8.5, color: PdfColors.grey700)),
                    ],
                  ),
                ),
              );

              return pdf.save();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Exact Evaluation PDF Preview'), centerTitle: true),
                body: PdfPreview(
                  build: (format) => generateFullReport(format),
                  canChangeOrientation: false,
                  canChangePageFormat: false,
                ),
              );
            }
          }
          EOF

