                            pw.Text('Calibrated: ${client.plotWidth}ft x ${client.plotLength}ft | Upper: ${(upperBal / balance).toStringAsFixed(2)} | Balance: 1.00 | Lower: ${(lowerBal / balance).toStringAsFixed(2)}', style: const pw.TextStyle(fontSize: 8, color: PdfColors.grey800)),
