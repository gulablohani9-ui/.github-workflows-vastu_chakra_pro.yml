name: Build Vastu Chakra Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Generate Vastu Chakra Pro App
        run: |
          rm -rf lib android
          flutter create --template=app --org=com.astro.vastuchakra --project-name=vastu_chakra_pro . --overwrite
          
          cat << 'EOF' > pubspec.yaml
          name: vastu_chakra_pro
          description: Vastu Floor Plan Centroid 16 Zones and 45 Devtas Engine
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            image_picker: ^1.0.7
            screenshot: ^2.1.0
            path_provider: ^2.1.2
            share_plus: ^7.2.2

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          EOF

          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'dart:math' as math;
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:screenshot/screenshot.dart';
          import 'package:share_plus/share_plus.dart';
          import 'package:path_provider/path_provider.dart';

          void main() {
            runApp(const VastuChakraApp());
          }

          class VastuChakraApp extends StatelessWidget {
            const VastuChakraApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Vastu Chakra Pro',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF121212),
                  primaryColor: Colors.amberAccent,
                  colorScheme: const ColorScheme.dark(
                    primary: Colors.amberAccent,
                    surface: Color(0xFF1E1E1E),
                  ),
                ),
                home: const VastuHomeScreen(),
              );
            }
          }

          class VastuHomeScreen extends StatefulWidget {
            const VastuHomeScreen({super.key});

            @override
            State<VastuHomeScreen> createState() => _VastuHomeScreenState();
          }

          class _VastuHomeScreenState extends State<VastuHomeScreen> {
            File? _mapImage;
            final ImagePicker _picker = ImagePicker();
            final ScreenshotController _screenshotController = ScreenshotController();

            List<Offset> points = [];
            int selectedDivision = 16; // 4, 8, 16, 32
            bool showDevtas = false;
            double northDegree = 0.0; // 0 to 360
            int selectedFrontEdge = 0; // Edge index A-B, B-C etc.

            Future<void> _pickImage(ImageSource source) async {
              final picked = await _picker.pickImage(source: source);
              if (picked != null) {
                setState(() {
                  _mapImage = File(picked.path);
                  points.clear();
                });
              }
            }

            Offset? calculateCentroid(List<Offset> pts) {
              if (pts.length < 3) return null;
              double area = 0.0;
              double cx = 0.0;
              double cy = 0.0;

              for (int i = 0; i < pts.length; i++) {
                int j = (i + 1) % pts.length;
                double factor = (pts[i].dx * pts[j].dy) - (pts[j].dx * pts[i].dy);
                area += factor;
                cx += (pts[i].dx + pts[j].dx) * factor;
                cy += (pts[i].dy + pts[j].dy) * factor;
              }
              area *= 0.5;
              if (area.abs() < 0.0001) return null;
              cx /= (6.0 * area);
              cy /= (6.0 * area);
              return Offset(cx, cy);
            }

            Future<void> _captureAndShare() async {
              try {
                final image = await _screenshotController.capture();
                if (image != null) {
                  final dir = await getTemporaryDirectory();
                  final file = File('${dir.path}/vastu_map_${DateTime.now().millisecondsSinceEpoch}.png');
                  await file.writeAsBytes(image);
                  await Share.shareXFiles([XFile(file.path)], text: 'Vastu Floor Plan Analysis Report');
                }
              } catch (e) {
                ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('Error saving: $e')));
              }
            }

            @override
            Widget build(BuildContext context) {
              Offset? centroid = calculateCentroid(points);

              return Scaffold(
                appBar: AppBar(
                  title: const Text('Vastu Chakra & Map Centroid'),
                  centerTitle: true,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.share, color: Colors.amberAccent),
                      tooltip: 'Capture & Share Map',
                      onPressed: _captureAndShare,
                    ),
                  ],
                ),
                body: Column(
                  children: [
                    Container(
                      color: const Color(0xFF1E1E1E),
                      padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          ElevatedButton.icon(
                            style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF2E2E2E), foregroundColor: Colors.amberAccent),
                            onPressed: () => _pickImage(ImageSource.gallery),
                            icon: const Icon(Icons.photo_library, size: 18),
                            label: const Text('Map'),
                          ),
                          ElevatedButton.icon(
                            style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF2E2E2E), foregroundColor: Colors.amberAccent),
                            onPressed: () => _pickImage(ImageSource.camera),
                            icon: const Icon(Icons.camera_alt, size: 18),
                            label: const Text('Camera'),
                          ),
                          ElevatedButton.icon(
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.redAccent.withOpacity(0.2), foregroundColor: Colors.redAccent),
                            onPressed: () => setState(() => points.clear()),
                            icon: const Icon(Icons.refresh, size: 18),
                            label: const Text('Reset Dots'),
                          ),
                        ],
                      ),
                    ),
                    Expanded(
                      child: Screenshot(
                        controller: _screenshotController,
                        child: GestureDetector(
                          onTapDown: (details) {
                            setState(() {
                              points.add(details.localPosition);
                            });
                          },
                          child: Stack(
                            fit: StackFit.expand,
                            children: [
                              Container(
                                color: Colors.black,
                                child: _mapImage != null
                                    ? Image.file(_mapImage!, fit: BoxFit.contain)
                                    : const Center(
                                        child: Text(
                                          '1. Upload Floor Plan Map or Click Photo\n2. Tap around plot corners to create boundary dots (A, B, C, D)\n3. App will auto calculate Brahmasthan (Center Point)',
                                          textAlign: TextAlign.center,
                                          style: TextStyle(color: Colors.grey, height: 1.5),
                                        ),
                                      ),
                              ),
                              CustomPaint(
                                painter: VastuPainter(
                                  points: points,
                                  centroid: centroid,
                                  division: selectedDivision,
                                  showDevtas: showDevtas,
                                  northDegree: northDegree,
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                    _buildBottomControlPanel(centroid),
                  ],
                ),
              );
            }

            Widget _buildBottomControlPanel(Offset? centroid) {
              return Container(
                color: const Color(0xFF1A1A1A),
                padding: const EdgeInsets.all(12),
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    Row(
                      children: [
                        const Text('North °:', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.amberAccent)),
                        Expanded(
                          child: Slider(
                            value: northDegree,
                            min: 0,
                            max: 360,
                            activeColor: Colors.amberAccent,
                            inactiveColor: Colors.grey,
                            onChanged: (val) => setState(() => northDegree = val),
                          ),
                        ),
                        Text('${northDegree.toInt()}°', style: const TextStyle(fontWeight: FontWeight.bold)),
                      ],
                    ),
                    Row(
                      mainAxisAlignment: MainAxisAlignment.spaceBetween,
                      children: [
                        const Text('Directions:', style: TextStyle(fontWeight: FontWeight.bold)),
                        ToggleButtons(
                          isSelected: [
                            selectedDivision == 4,
                            selectedDivision == 8,
                            selectedDivision == 16,
                            selectedDivision == 32,
                          ],
                          onPressed: (index) {
                            setState(() {
                              if (index == 0) selectedDivision = 4;
                              if (index == 1) selectedDivision = 8;
                              if (index == 2) selectedDivision = 16;
                              if (index == 3) selectedDivision = 32;
                            });
                          },
                          color: Colors.white60,
                          selectedColor: Colors.black,
                          fillColor: Colors.amberAccent,
                          borderRadius: BorderRadius.circular(8),
                          children: const [
                            Padding(padding: EdgeInsets.symmetric(horizontal: 8), child: Text('4')),
                            Padding(padding: EdgeInsets.symmetric(horizontal: 8), child: Text('8')),
                            Padding(padding: EdgeInsets.symmetric(horizontal: 8), child: Text('16')),
                            Padding(padding: EdgeInsets.symmetric(horizontal: 8), child: Text('32')),
                          ],
                        ),
                        FilterChip(
                          label: const Text('45 Devtas', style: TextStyle(fontSize: 12)),
                          selected: showDevtas,
                          selectedColor: Colors.orangeAccent,
                          onSelected: (val) => setState(() => showDevtas = val),
                        ),
                      ],
                    ),
                    const SizedBox(height: 6),
                    if (points.isNotEmpty)
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Text('Plot Corners: ${points.length} Dots', style: const TextStyle(color: Colors.grey, fontSize: 12)),
                          if (points.length >= 2)
                            Text('Front Wall: Dot 1 -> Dot 2', style: const TextStyle(color: Colors.tealAccent, fontSize: 12)),
                          Text(centroid != null ? 'Brahmasthan: Locked' : 'Need 3+ Dots',
                              style: TextStyle(color: centroid != null ? Colors.greenAccent : Colors.redAccent, fontSize: 12, fontWeight: FontWeight.bold)),
                        ],
                      ),
                  ],
                ),
              );
            }
          }

          class VastuPainter extends CustomPainter {
            final List<Offset> points;
            final Offset? centroid;
            final int division;
            final bool showDevtas;
            final double northDegree;

            VastuPainter({
              required this.points,
              required this.centroid,
              required this.division,
              required this.showDevtas,
              required this.northDegree,
            });

            static const List<String> dir4 = ['N', 'E', 'S', 'W'];
            static const List<String> dir8 = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            static const List<String> dir16 = [
              'N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE',
              'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'
            ];
            static const List<String> dir32 = [
              'N1', 'N2', 'N3', 'N4', 'N5', 'N6', 'N7', 'N8',
              'E1', 'E2', 'E3', 'E4', 'E5', 'E6', 'E7', 'E8',
              'S1', 'S2', 'S3', 'S4', 'S5', 'S6', 'S7', 'S8',
              'W1', 'W2', 'W3', 'W4', 'W5', 'W6', 'W7', 'W8'
            ];
            static const List<String> devtas45 = [
              'Shikhi', 'Parjanya', 'Jayant', 'Indra', 'Surya', 'Satya', 'Bhrisha', 'Antariksha',
              'Agni', 'Pusha', 'Vitatha', 'Brihatkshata', 'Yama', 'Gandharva', 'Bhringraj', 'Mriga',
              'Pitr', 'Dauvarika', 'Sugriva', 'Pushpadanta', 'Varuna', 'Asura', 'Shosha', 'Papanayakshma',
              'Roga', 'Naga', 'Mukhya', 'Bhallata', 'Soma', 'Bhujanga', 'Aditi', 'Diti'
            ];

            @override
            void paint(Canvas canvas, Size size) {
              final boundaryPaint = Paint()
                ..color = Colors.tealAccent
                ..strokeWidth = 2.0
                ..style = PaintingStyle.stroke;

              final dotPaint = Paint()
                ..color = Colors.amberAccent
                ..style = PaintingStyle.fill;

              final centroidPaint = Paint()
                ..color = Colors.redAccent
                ..style = PaintingStyle.fill;

              // 1. Draw Boundary Polygon
              if (points.isNotEmpty) {
                Path path = Path()..moveTo(points[0].dx, points[0].dy);
                for (int i = 0; i < points.length; i++) {
                  canvas.drawCircle(points[i], 6, dotPaint);
                  TextPainter(
                    text: TextSpan(text: ' ${String.fromCharCode(65 + (i % 26))}', style: const TextStyle(color: Colors.white, fontSize: 12, fontWeight: FontWeight.bold)),
                    textDirection: TextDirection.ltr,
                  )..layout()..paint(canvas, points[i] + const Offset(6, -10));

                  if (i > 0) path.lineTo(points[i].dx, points[i].dy);
                }
                if (points.length >= 3) {
                  path.close();
                  canvas.drawPath(path, boundaryPaint);
                  canvas.drawPath(path, Paint()..color = Colors.tealAccent.withOpacity(0.08)..style = PaintingStyle.fill);
                }
              }

              // 2. Draw Brahmasthan (Center Point)
              if (centroid != null) {
                canvas.drawCircle(centroid!, 7, centroidPaint);
                canvas.drawCircle(centroid!, 18, Paint()..color = Colors.redAccent.withOpacity(0.3)..style = PaintingStyle.stroke..strokeWidth = 2);

                TextPainter(
                  text: const TextSpan(text: ' Brahmasthan (Center)', style: TextStyle(color: Colors.redAccent, fontSize: 11, fontWeight: FontWeight.bold)),
                  textDirection: TextDirection.ltr,
                )..layout()..paint(canvas, centroid! + const Offset(10, 4));

                // 3. Draw Vastu Direction Lines & Sectors
                double radius = 170.0;
                List<String> activeLabels;
                if (division == 4) activeLabels = dir4;
                else if (division == 8) activeLabels = dir8;
                else if (division == 32) activeLabels = dir32;
                else activeLabels = dir16;

                double step = 360.0 / activeLabels.length;
                double offsetRad = (northDegree - 90) * (math.pi / 180.0);

                for (int i = 0; i < activeLabels.length; i++) {
                  double angle = (i * step) * (math.pi / 180.0) + offsetRad;
                  Offset endPoint = Offset(
                    centroid!.dx + radius * math.cos(angle),
                    centroid!.dy + radius * math.sin(angle),
                  );

                  // Radials
                  canvas.drawLine(
                    centroid!,
                    endPoint,
                    Paint()..color = Colors.amberAccent.withOpacity(0.45)..strokeWidth = 1.0,
                  );

                  // Labels
                  Offset textPos = Offset(
                    centroid!.dx + (radius + 14) * math.cos(angle),
                    centroid!.dy + (radius + 14) * math.sin(angle),
                  );

                  TextPainter tp = TextPainter(
                    text: TextSpan(
                      text: activeLabels[i],
                      style: TextStyle(
                        color: activeLabels[i].contains('N') ? Colors.greenAccent : (activeLabels[i].contains('S') ? Colors.redAccent : Colors.amberAccent),
                        fontSize: division == 32 ? 9 : 11,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    textDirection: TextDirection.ltr,
                  )..layout();
                  tp.paint(canvas, textPos - Offset(tp.width / 2, tp.height / 2));
                }

                // 4. Draw 45 Vastu Devtas Names (Outer Energy Ring)
                if (showDevtas) {
                  double devtaRadius = radius * 0.72;
                  double devtaStep = 360.0 / devtas45.length;
                  for (int d = 0; d < devtas45.length; d++) {
                    double devtaAngle = (d * devtaStep) * (math.pi / 180.0) + offsetRad;
                    Offset devtaPos = Offset(
                      centroid!.dx + devtaRadius * math.cos(devtaAngle),
                      centroid!.dy + devtaRadius * math.sin(devtaAngle),
                    );

                    TextPainter(
                      text: TextSpan(
                        text: devtas45[d],
                        style: const TextStyle(color: Colors.orangeAccent, fontSize: 8, fontWeight: FontWeight.bold),
                      ),
                      textDirection: TextDirection.ltr,
                    )..layout()..paint(canvas, devtaPos - const Offset(12, 4));
                  }
                }
              }
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }
          EOF

      - name: Force Update Android Manifest with Permissions
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.astro.vastuchakra">
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
             <application
                  android:label="Vastu Chakra Pro"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        run: |
          mkdir -p artifact_dir
          cp build/app/outputs/flutter-apk/app-release.apk artifact_dir/Vastu-Chakra-Pro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vastu-Chakra-Pro
          path: artifact_dir/Vastu-Chakra-Pro.apk
