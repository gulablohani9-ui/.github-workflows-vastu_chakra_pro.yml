                      pw.Text('Email: info@glohanivastu.com | PH: +91-8777614891', style: const pw.TextStyle(fontSize: 6.5, color: PdfColors.grey600)),
                    ],
                  ),
                ],
              );
            }

            pw.Widget buildDynamicMapOverlay({
              required Uint8List? chakraAsset,
              required double degree,
              double size = 330,
            }) {
              return pw.Container(
                width: size,
                height: size,
                child: pw.Stack(
                  alignment: pw.Alignment.center,
                  children: [
                    if (mapImageBytes != null)
                      pw.Image(pw.MemoryImage(mapImageBytes!), width: size - 30, height: size - 30, fit: pw.BoxFit.contain),
                    if (chakraAsset != null)
                      pw.Opacity(
                        opacity: mapImageBytes != null ? 0.75 : 1.0,
