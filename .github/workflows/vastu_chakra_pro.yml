                    final Map<String, double> areas = data['areas'];
                    final double balance = data['balance'];
                    final double upperBal = data['upperBal'];
                    final double lowerBal = data['lowerBal'];
                    final List<String> zones = data['zones'];

                    double maxScale = areas.values.reduce(math.max) * 1.15;

                    List<String> cutZones = [];
                    List<String> extendedZones = [];

                    for (String z in zones) {
                      double val = areas[z]!;
                      if (val < lowerBal) {
                        cutZones.add('$z (${(val / balance).toStringAsFixed(2)})');
                      } else if (val > upperBal) {
                        extendedZones.add('$z (${(val / balance).toStringAsFixed(2)})');
                      }
                    }

                    return pw.Column(
                      crossAxisAlignment: pw.CrossAxisAlignment.start,
                      children: [
                        buildHeader('GLOHANI VASTU ZONAL STRENGTH GRAPH'),
                        pw.Row(
                          mainAxisAlignment: pw.MainAxisAlignment.spaceBetween,
