name: Build Glohani Vastu 37-Page Suite APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Generate Glohani Vastu Master Suite
        run: |
          rm -rf lib android
          flutter create --template=app --org=com.glohani.vastureport --project-name=glohani_vastu_pro . --overwrite
          
          cat << 'EOF' > pubspec.yaml
          name: glohani_vastu_pro
          description: Glohani Vastu Exact 37-Page Professional Evaluation Suite
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            image_picker: ^1.0.7
            path_provider: ^2.1.2
            share_plus: ^7.2.2
            pdf: ^3.10.7
            printing: ^5.11.1
            intl: ^0.19.0

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
            assets:
              - assets/images/
          EOF

          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'dart:math' as math;
          import 'dart:typed_data';
          import 'dart:ui' as ui;
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart' show rootBundle;
          import 'package:image_picker/image_picker.dart';
          import 'package:pdf/pdf.dart';
          import 'package:pdf/widgets.dart' as pw;
          import 'package:printing/printing.dart';
          import 'package:intl/intl.dart';

          void main() {
            runApp(const GlohaniVastuApp());
          }

          class GlohaniVastuApp extends StatelessWidget {
            const GlohaniVastuApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Glohani Vastu Pro',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF121212),
                  primaryColor: Colors.tealAccent,
                  colorScheme: const ColorScheme.dark(
                    primary: Colors.tealAccent,
                    surface: Color(0xFF1E1E1E),
                  ),
                ),
                home: const MainMasterDashboard(),
              );
            }
          }

          class MasterClientData {
            String name = "Ghanshyam";
            String propertyType = "HOME";
            String address = "Jodhpur, Rajasthan, India";
            DateTime dob = DateTime(1983, 6, 30);
            TimeOfDay birthTime = const TimeOfDay(hour: 1, minute: 20);
            String birthPlace = "Jodhpur, Rajasthan, India";
            double northDegree = 254.0;

            String get formattedBirthTime {
              final h = birthTime.hour.toString().padLeft(2, '0');
              final m = birthTime.minute.toString().padLeft(2, '0');
              return "$h:$m AM";
            }
          }

          class MainMasterDashboard extends StatefulWidget {
            const MainMasterDashboard({super.key});

            @override
            State<MainMasterDashboard> createState() => _MainMasterDashboardState();
          }

          class _MainMasterDashboardState extends State<MainMasterDashboard> {
            final MasterClientData client = MasterClientData();
            File? mapImage;
            Uint8List? mapImageBytes;
            List<Offset> plotPoints = [];
            int currentTab = 0;

            Offset? getCentroid(List<Offset> pts) {
              if (pts.length < 3) return null;
              double area = 0.0, cx = 0.0, cy = 0.0;
              for (int i = 0; i < pts.length; i++) {
                int j = (i + 1) % pts.length;
                double factor = (pts[i].dx * pts[j].dy) - (pts[j].dx * pts[i].dy);
                area += factor;
                cx += (pts[i].dx + pts[j].dx) * factor;
                cy += (pts[i].dy + pts[j].dy) * factor;
              }
              area *= 0.5;
              if (area.abs() < 0.001) return null;
              return Offset(cx / (6 * area), cy / (6 * area));
            }

            @override
            Widget build(BuildContext context) {
              Offset? centroid = getCentroid(plotPoints);

              final screens = [
                ClientInputScreen(client: client, onUpdate: () => setState(() {})),
                VastuMapEditor(
                  mapImage: mapImage,
                  points: plotPoints,
                  centroid: centroid,
                  northDegree: client.northDegree,
                  onPickImage: (f, b) => setState(() {
                    mapImage = f;
                    mapImageBytes = b;
                  }),
                  onPointsUpdate: (pts) => setState(() => plotPoints = pts),
                  onDegreeChanged: (deg) => setState(() => client.northDegree = deg),
                ),
                AstroCalculationsScreen(client: client),
                PdfReportPreviewScreen(
                  client: client,
                  mapImageBytes: mapImageBytes,
                  points: plotPoints,
                  centroid: centroid,
                ),
              ];

              return Scaffold(
                body: screens[currentTab],
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: currentTab,
                  selectedItemColor: Colors.tealAccent,
                  unselectedItemColor: Colors.grey,
                  backgroundColor: const Color(0xFF1E1E1E),
                  type: BottomNavigationBarType.fixed,
                  onTap: (idx) => setState(() => currentTab = idx),
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.person), label: 'Client / DOB'),
                    BottomNavigationBarItem(icon: Icon(Icons.architecture), label: 'Map & Degree'),
                    BottomNavigationBarItem(icon: Icon(Icons.auto_awesome), label: 'Astro Parameters'),
                    BottomNavigationBarItem(icon: Icon(Icons.picture_as_pdf), label: 'Glohani PDF'),
                  ],
                ),
              );
            }
          }

          class ClientInputScreen extends StatelessWidget {
            final MasterClientData client;
            final VoidCallback onUpdate;
            const ClientInputScreen({super.key, required this.client, required this.onUpdate});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Client & Astro Profile'), centerTitle: true),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    TextFormField(
                      initialValue: client.name,
                      decoration: const InputDecoration(labelText: 'Client Name', border: OutlineInputBorder()),
                      onChanged: (v) { client.name = v; onUpdate(); },
                    ),
                    const SizedBox(height: 12),
                    TextFormField(
                      initialValue: client.address,
                      decoration: const InputDecoration(labelText: 'Property Address', border: OutlineInputBorder()),
                      onChanged: (v) { client.address = v; onUpdate(); },
                    ),
                    const SizedBox(height: 12),
                    DropdownButtonFormField<String>(
                      value: client.propertyType,
                      decoration: const InputDecoration(labelText: 'Property Type', border: OutlineInputBorder()),
                      items: ['HOME', 'FLAT', 'OFFICE', 'LAND', 'COMMERCIAL SPACE', 'FACTORY']
                          .map((e) => DropdownMenuItem(value: e, child: Text(e)))
                          .toList(),
                      onChanged: (v) { if (v != null) { client.propertyType = v; onUpdate(); } },
                    ),
                    const SizedBox(height: 16),
                    const Text('Astro-Vastu Birth Details', style: TextStyle(color: Colors.tealAccent, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 10),
                    ListTile(
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8), side: const BorderSide(color: Colors.white24)),
                      title: Text('DOB: ${DateFormat('dd-MM-yyyy').format(client.dob)}'),
                      trailing: const Icon(Icons.calendar_today, color: Colors.tealAccent),
                      onTap: () async {
                        DateTime? d = await showDatePicker(
                          context: context,
                          initialDate: client.dob,
                          firstDate: DateTime(1940),
                          lastDate: DateTime(2035),
                        );
                        if (d != null) { client.dob = d; onUpdate(); }
                      },
                    ),
                    const SizedBox(height: 10),
                    ListTile(
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8), side: const BorderSide(color: Colors.white24)),
                      title: Text('Birth Time: ${client.formattedBirthTime}'),
                      trailing: const Icon(Icons.access_time, color: Colors.tealAccent),
                      onTap: () async {
                        TimeOfDay? t = await showTimePicker(context: context, initialTime: client.birthTime);
                        if (t != null) { client.birthTime = t; onUpdate(); }
                      },
                    ),
                    const SizedBox(height: 12),
                    TextFormField(
                      initialValue: client.birthPlace,
                      decoration: const InputDecoration(labelText: 'Birth Place', border: OutlineInputBorder()),
                      onChanged: (v) { client.birthPlace = v; onUpdate(); },
                    ),
                  ],
                ),
              );
            }
          }

          class VastuMapEditor extends StatefulWidget {
            final File? mapImage;
            final List<Offset> points;
            final Offset? centroid;
            final double northDegree;
            final Function(File, Uint8List) onPickImage;
            final Function(List<Offset>) onPointsUpdate;
            final Function(double) onDegreeChanged;

            const VastuMapEditor({
              super.key,
              required this.mapImage,
              required this.points,
              required this.centroid,
              required this.northDegree,
              required this.onPickImage,
              required this.onPointsUpdate,
              required this.onDegreeChanged,
            });

            @override
            State<VastuMapEditor> createState() => _VastuMapEditorState();
          }

          class _VastuMapEditorState extends State<VastuMapEditor> {
            int? draggedIdx;

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Plot Boundary & Centroid'),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.photo_library),
                      onPressed: () async {
                        final p = await ImagePicker().pickImage(source: ImageSource.gallery);
                        if (p != null) {
                          final bytes = await p.readAsBytes();
                          widget.onPickImage(File(p.path), bytes);
                        }
                      },
                    ),
                    IconButton(
                      icon: const Icon(Icons.refresh, color: Colors.redAccent),
                      onPressed: () => widget.onPointsUpdate([]),
                    )
                  ],
                ),
                body: Column(
                  children: [
                    Expanded(
                      child: GestureDetector(
                        onPanDown: (d) {
                          for (int i = 0; i < widget.points.length; i++) {
                            if ((widget.points[i] - d.localPosition).distance < 25) {
                              draggedIdx = i;
                              return;
                            }
                          }
                          List<Offset> up = List.from(widget.points)..add(d.localPosition);
                          widget.onPointsUpdate(up);
                        },
                        onPanUpdate: (d) {
                          if (draggedIdx != null) {
                            List<Offset> up = List.from(widget.points);
                            up[draggedIdx!] = d.localPosition;
                            widget.onPointsUpdate(up);
                          }
                        },
                        onPanEnd: (_) => draggedIdx = null,
                        child: Stack(
                          fit: StackFit.expand,
                          children: [
                            Container(
                              color: Colors.black,
                              child: widget.mapImage != null
                                  ? Image.file(widget.mapImage!, fit: BoxFit.contain)
                                  : const Center(child: Text('Tap Gallery icon to load floor plan.\nTap plot corners to set boundary.\nDrag any point to reposition.', textAlign: TextAlign.center)),
                            ),
                            CustomPaint(
                              painter: ReportVastuPainter(
                                points: widget.points,
                                centroid: widget.centroid,
                                northDegree: widget.northDegree,
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                    Container(
                      color: const Color(0xFF1E1E1E),
                      padding: const EdgeInsets.all(12),
                      child: Row(
                        children: [
                          const Text('North Degree: ', style: TextStyle(color: Colors.tealAccent, fontWeight: FontWeight.bold)),
                          Expanded(
                            child: Slider(
                              value: widget.northDegree,
                              min: 0,
                              max: 360,
                              onChanged: widget.onDegreeChanged,
                            ),
                          ),
                          Text('${widget.northDegree.toInt()}°', style: const TextStyle(fontWeight: FontWeight.bold)),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class AstroCalculationsScreen extends StatelessWidget {
            final MasterClientData client;
            const AstroCalculationsScreen({super.key, required this.client});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Astro-Vastu Parameters'), centerTitle: true),
                body: ListView(
                  padding: const EdgeInsets.all(14),
                  children: const [
                    Card(
                      child: Padding(
                        padding: EdgeInsets.all(12.0),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text('Aries (Mesha) Lagna Matrix', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.tealAccent)),
                            SizedBox(height: 6),
                            Text('• Ascendant: Aries (Mesha) - 04° 12\' 20"'),
                            Text('• Moon Sign: Aquarius (Kumbha) - 02° 53\' 47"'),
                            Text('• Sun Sign: Gemini (Mithuna) - 13° 52\' 25"'),
                            Text('• Active Mahadasha: Saturn (Mula Nakshatra, House 9)'),
                            Text('• Numerology: Mulank 3 (Jupiter) | Bhagyank 3 (Jupiter)'),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class PdfReportPreviewScreen extends StatelessWidget {
            final MasterClientData client;
            final Uint8List? mapImageBytes;
            final List<Offset> points;
            final Offset? centroid;

            const PdfReportPreviewScreen({
              super.key,
              required this.client,
              required this.mapImageBytes,
              required this.points,
              required this.centroid,
            });

            Future<Uint8List?> _loadAssetBytes(String path) async {
              try {
                final data = await rootBundle.load(path);
                return data.buffer.asUint8List();
              } catch (_) {
                return null;
              }
            }

            pw.Widget buildHeader(String title) {
              return pw.Column(
                crossAxisAlignment: pw.CrossAxisAlignment.center,
                children: [
                  pw.Row(
                    mainAxisAlignment: pw.MainAxisAlignment.spaceBetween,
                    children: [
                      pw.Text('Glohani Vastu', style: pw.TextStyle(fontSize: 16, fontWeight: pw.FontWeight.bold, color: PdfColors.red800)),
                      pw.Text('www.glohanivastu.com', style: const pw.TextStyle(fontSize: 8, color: PdfColors.blue800)),
                    ],
                  ),
                  pw.Text('ACCURATE COMBINATION OF DASHA & DISHA', style: const pw.TextStyle(fontSize: 7.5, fontStyle: pw.FontStyle.italic, color: PdfColors.teal)),
                  pw.SizedBox(height: 3),
                  pw.Text(title, style: pw.TextStyle(fontSize: 11, fontWeight: pw.FontWeight.bold)),
                  pw.Divider(color: PdfColors.grey400, thickness: 0.8),
                ],
              );
            }

            pw.Widget buildFooter() {
              return pw.Column(
                children: [
                  pw.Divider(color: PdfColors.grey400, thickness: 0.8),
                  pw.Row(
                    mainAxisAlignment: pw.MainAxisAlignment.spaceBetween,
                    children: [
                      pw.Text('Sample Vastu Evaluation Report: Glohani Vastu All Rights Reserved', style: const pw.TextStyle(fontSize: 6.5, color: PdfColors.grey600)),
                      pw.Text('Email: info@glohanivastu.com', style: const pw.TextStyle(fontSize: 6.5, color: PdfColors.grey600)),
                    ],
                  ),
                ],
              );
            }

            pw.Widget buildMasterIntegratedFloorMap({
              required Uint8List? bgMap,
              required Uint8List? chakraBytes,
              required double degree,
            }) {
              return pw.Container(
                width: 360,
                height: 360,
                decoration: pw.BoxDecoration(border: pw.Border.all(color: PdfColors.grey400, width: 1.2)),
                child: pw.Stack(
                  alignment: pw.Alignment.center,
                  children: [
                    if (bgMap != null)
                      pw.Image(pw.MemoryImage(bgMap), width: 330, height: 330, fit: pw.BoxFit.contain),

                    if (chakraBytes != null)
                      pw.Transform.rotate(
                        angle: (degree) * (math.pi / 180),
                        child: pw.Image(pw.MemoryImage(chakraBytes), width: 350, height: 350, fit: pw.BoxFit.contain),
                      ),

                    pw.Transform.rotate(
                      angle: (degree - 90) * (math.pi / 180),
                      child: pw.CustomPaint(
                        size: const PdfPoint(240, 240),
                        painter: (PdfGraphics canvas, PdfPoint size) {
                          canvas.setColor(PdfColors.red);
                          canvas.setLineWidth(2.2);
                          canvas.drawLine(120, 120, 230, 120);
                          canvas.strokePath();
                          canvas.drawLine(230, 120, 215, 112);
                          canvas.strokePath();
                          canvas.drawLine(230, 120, 215, 128);
                          canvas.strokePath();
                        },
                      ),
                    ),

                    pw.Container(
                      width: 14,
                      height: 14,
                      decoration: const pw.BoxDecoration(shape: pw.BoxShape.circle, color: PdfColors.redAccent),
                    ),
                    pw.Container(
                      width: 6,
                      height: 6,
                      decoration: const pw.BoxDecoration(shape: pw.BoxShape.circle, color: PdfColors.yellowAccent),
                    ),
                  ],
                ),
              );
            }

            // EXACT 33% BRAHMA - 77% DEVA/MANUSHYA - 100% PISHACHA RECTANGULAR RADIAL ENGINE
            pw.Widget buildConcentric45DevtaPlate({
              required Uint8List? bgMap,
              required double degree,
            }) {
              const List<String> topLabels = ['दिति', 'ईश', 'पर्जन्य', 'जयन्त', 'महेन्द्र', 'सूर्य'];
              const List<String> rightLabels = ['सत्य', 'भृश', 'अन्तरिक्ष', 'अग्नि', 'पूषा', 'वितथ', 'गृहक्षत', 'यम', 'गन्धर्व', 'भृंग'];
              const List<String> bottomLabels = ['मृग', 'पितृ', 'दौवारिक', 'सुग्रीव', 'पुष्पदन्त', 'वरुण'];
              const List<String> leftLabels = ['असुर', 'शोष', 'पापयक्ष्मा', 'रोग', 'नाग', 'मुख्य', 'भल्लाट', 'सोम', 'भुजंग', 'अदिति'];

              return pw.Column(
                children: [
                  pw.Container(
                    width: 360,
                    height: 350,
                    decoration: pw.BoxDecoration(border: pw.Border.all(color: PdfColors.grey400, width: 1.0)),
                    child: pw.Stack(
                      alignment: pw.Alignment.center,
                      children: [
                        if (bgMap != null)
                          pw.Image(pw.MemoryImage(bgMap), width: 330, height: 330, fit: pw.BoxFit.contain),

                        // Rotated Radial Concentric Grid
                        pw.Transform.rotate(
                          angle: (degree) * (math.pi / 180),
                          child: pw.Container(
                            width: 270,
                            height: 310,
                            child: pw.CustomPaint(
                              size: const PdfPoint(270, 310),
                              painter: (PdfGraphics canvas, PdfPoint size) {
                                double w = 270;
                                double h = 310;
                                double cx = w / 2;
                                double cy = h / 2;

                                canvas.setColor(PdfColors.blueGrey800);
                                canvas.setLineWidth(1.2);

                                // 1. Outer Box (100% Perimeter - Pishacha Vithi)
                                canvas.drawRect(5, 5, w - 10, h - 10);
                                canvas.strokePath();

                                // 2. Intermediate Box (77% - Deva + Manushya Vithi)
                                double w77 = (w - 10) * 0.77;
                                double h77 = (h - 10) * 0.77;
                                canvas.drawRect(cx - w77 / 2, cy - h77 / 2, w77, h77);
                                canvas.strokePath();

                                // 3. Central Brahma Box (33% - Brahma Vithi)
                                double w33 = (w - 10) * 0.33;
                                double h33 = (h - 10) * 0.33;
                                canvas.setColor(PdfColors.black);
                                canvas.setLineWidth(1.4);
                                canvas.drawRect(cx - w33 / 2, cy - h33 / 2, w33, h33);
                                canvas.strokePath();

                                // Radial Projection Rays from Brahma to Boundary (Deva & Manushya lines)
                                canvas.setColor(PdfColors.blue800);
                                canvas.setLineWidth(0.85);

                                void drawRadial(double x1, double y1, double x2, double y2) {
                                  canvas.drawLine(x1, y1, x2, y2);
                                  canvas.strokePath();
                                }

                                // Top Rays
                                for (int i = 1; i <= 6; i++) {
                                  double px = 5 + ((w - 10) / 7) * i;
                                  double bx = (cx - w33 / 2) + (w33 / 7) * i;
                                  drawRadial(bx, cy - h33 / 2, px, 5);
                                }
                                // Bottom Rays
                                for (int i = 1; i <= 6; i++) {
                                  double px = 5 + ((w - 10) / 7) * i;
                                  double bx = (cx - w33 / 2) + (w33 / 7) * i;
                                  drawRadial(bx, cy + h33 / 2, px, h - 5);
                                }
                                // Left Rays
                                for (int i = 1; i <= 10; i++) {
                                  double py = 5 + ((h - 10) / 11) * i;
                                  double by = (cy - h33 / 2) + (h33 / 11) * i;
                                  drawRadial(cx - w33 / 2, by, 5, py);
                                }
                                // Right Rays
                                for (int i = 1; i <= 10; i++) {
                                  double py = 5 + ((h - 10) / 11) * i;
                                  double by = (cy - h33 / 2) + (h33 / 11) * i;
                                  drawRadial(cx + w33 / 2, by, w - 5, py);
                                }

                                // 4 Corners to Center Rays
                                drawRadial(cx - w33 / 2, cy - h33 / 2, 5, 5);
                                drawRadial(cx + w33 / 2, cy - h33 / 2, w - 5, 5);
                                drawRadial(cx - w33 / 2, cy + h33 / 2, 5, h - 5);
                                drawRadial(cx + w33 / 2, cy + h33 / 2, w - 5, h - 5);

                                // Node Red Dots on Perimeter
                                canvas.setColor(PdfColors.red);
                                for (int i = 0; i <= 7; i++) {
                                  canvas.drawCircle(5 + ((w - 10) / 7) * i, 5, 2.5);
                                  canvas.fillPath();
                                  canvas.drawCircle(5 + ((w - 10) / 7) * i, h - 5, 2.5);
                                  canvas.fillPath();
                                }
                                for (int i = 0; i <= 11; i++) {
                                  canvas.drawCircle(5, 5 + ((h - 10) / 11) * i, 2.5);
                                  canvas.fillPath();
                                  canvas.drawCircle(w - 5, 5 + ((h - 10) / 11) * i, 2.5);
                                  canvas.fillPath();
                                }
                              },
                            ),
                          ),
                        ),

                        // Center Centroid Node Coordinate
                        pw.Container(
                          width: 8,
                          height: 8,
                          decoration: const pw.BoxDecoration(shape: pw.BoxShape.circle, color: PdfColors.blue900),
                        ),
                        pw.Positioned(
                          child: pw.Text('Brahma (33%)', style: pw.TextStyle(fontSize: 8, fontWeight: pw.FontWeight.bold, color: PdfColors.blueGrey900)),
                        ),
                      ],
                    ),
                  ),
                  pw.SizedBox(height: 4),
                  pw.Text('45 Devta Grid (Center 33% Brahma, 77% Deva/Manushya, 100% Pishacha)', style: pw.TextStyle(fontSize: 8, fontWeight: pw.FontWeight.bold, color: PdfColors.red800)),
                ],
              );
            }

            // PURE VECTOR 100% TRANSPARENT COLOR FRAME
            pw.Widget buildVectorColorPlanPlate({
              required Uint8List? bgMap,
              required double degree,
              required bool isAvoidPlan,
            }) {
              final recTop = [PdfColors.yellow, PdfColors.amber, PdfColors.orangeAccent, PdfColors.grey300];
              final recRight = [PdfColors.grey400, PdfColors.grey600, PdfColors.blueGrey800, PdfColors.indigo900];
              final recBottom = [PdfColors.purple, PdfColors.greenAccent, PdfColors.green700, PdfColors.lightGreen];
              final recLeft = [PdfColors.red, PdfColors.pink, PdfColors.purpleAccent, PdfColors.amber200];

              final avoidTop = [PdfColors.red, PdfColors.pinkAccent, PdfColors.purple, PdfColors.deepPurple];
              final avoidRight = [PdfColors.red700, PdfColors.orange, PdfColors.amber, PdfColors.yellow];
              final avoidBottom = [PdfColors.blueGrey800, PdfColors.white, PdfColors.lightGreenAccent, PdfColors.yellow];
