          // WINDOW 4: PDF REPORT EXPORT WINDOW
          class PdfExportWindow extends StatelessWidget {
            final List<Offset> points;
            final Offset? centroid;
            final double northDegree;
            final int selectedDivision;
            final ScreenshotController screenshotController;

            const PdfExportWindow({
              super.key,
              required this.points,
              required this.centroid,
              required this.northDegree,
              required this.selectedDivision,
              required this.screenshotController,
            });

            Future<Uint8List> _generatePdf(PdfPageFormat format) async {
              final pdf = pw.Document();
              Uint8List? capturedImageBytes;

              try {
                capturedImageBytes = await screenshotController.capture();
              } catch (_) {}

              pdf.addPage(
                pw.Page(
                  pageFormat: format,
                  build: (pw.Context context) {
                    return pw.Column(
                      crossAxisAlignment: pw.CrossAxisAlignment.start,
                      children: [
                        pw.Header(
                          level: 0,
                          child: pw.Text('Vastu Floor Plan & Centroid Report', style: pw.TextStyle(fontSize: 22, fontWeight: pw.FontWeight.bold)),
                        ),
                        pw.SizedBox(height: 10),
                        pw.Text('North Compass Degree: ${northDegree.toInt()}° | Direction Grid: $selectedDivision Zones'),
                        pw.Text('Plot Boundary Corners: ${points.length} Points (Polygon Centroid Mode)'),
                        pw.Text('Brahmasthan Status: ${centroid != null ? "Calculated (Center Locked)" : "Incomplete"}'),
                        pw.SizedBox(height: 15),
                        if (capturedImageBytes != null)
                          pw.Center(
                            child: pw.Image(pw.MemoryImage(capturedImageBytes), height: 260),
                          ),
                        pw.SizedBox(height: 20),
                        pw.Text('Key Vastu Directions Reference:', style: pw.TextStyle(fontWeight: pw.FontWeight.bold)),
                        pw.Bullet(text: 'North (Kuber/Water): Wealth, Opportunities, Cash Inflow'),
                        pw.Bullet(text: 'North-East (Ishan): Mental Clarity, Spiritual Wisdom'),
                        pw.Bullet(text: 'South-East (Agni): Cash Liquidity, Fire Energy, Digestion'),
                        pw.Bullet(text: 'South-West (Nairutya): Stability, Mastery, Family Bonding'),
                      ],
                    );
                  },
                ),
              );

              return pdf.save();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Export Vastu PDF Report'), centerTitle: true),
                body: PdfPreview(
                  build: (format) => _generatePdf(format),
                  canChangeOrientation: false,
                  canChangePageFormat: false,
                ),
              );
            }
          }

          // CUSTOM PAINTER FOR MAP
          class VastuPainter extends CustomPainter {
            final List<Offset> points;
            final Offset? centroid;
            final int division;
            final bool showDevtas;
            final double northDegree;

            VastuPainter({
              required this.points,
              required this.centroid,
              required this.division,
              required this.showDevtas,
              required this.northDegree,
            });

            static const List<String> dir4 = ['N', 'E', 'S', 'W'];
            static const List<String> dir8 = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            static const List<String> dir16 = [
              'N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE',
              'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'
            ];
            static const List<String> dir32 = [
              'N1', 'N2', 'N3', 'N4', 'N5', 'N6', 'N7', 'N8',
              'E1', 'E2', 'E3', 'E4', 'E5', 'E6', 'E7', 'E8',
              'S1', 'S2', 'S3', 'S4', 'S5', 'S6', 'S7', 'S8',
              'W1', 'W2', 'W3', 'W4', 'W5', 'W6', 'W7', 'W8'
            ];
            static const List<String> devtas45 = [
              'Shikhi', 'Parjanya', 'Jayant', 'Indra', 'Surya', 'Satya', 'Bhrisha', 'Antariksha',
              'Agni', 'Pusha', 'Vitatha', 'Brihatkshata', 'Yama', 'Gandharva', 'Bhringraj', 'Mriga',
              'Pitr', 'Dauvarika', 'Sugriva', 'Pushpadanta', 'Varuna', 'Asura', 'Shosha', 'Papanayakshma',
              'Roga', 'Naga', 'Mukhya', 'Bhallata', 'Soma', 'Bhujanga', 'Aditi', 'Diti'
            ];

            @override
            void paint(Canvas canvas, Size size) {
              final boundaryPaint = Paint()
                ..color = Colors.tealAccent
                ..strokeWidth = 2.0
                ..style = PaintingStyle.stroke;

              final dotPaint = Paint()..color = Colors.amberAccent;
              final centroidPaint = Paint()..color = Colors.redAccent;

              if (points.isNotEmpty) {
                Path path = Path()..moveTo(points[0].dx, points[0].dy);
                for (int i = 0; i < points.length; i++) {
                  canvas.drawCircle(points[i], 7, dotPaint);
                  canvas.drawCircle(points[i], 12, Paint()..color = Colors.amberAccent.withOpacity(0.3)..style = PaintingStyle.stroke..strokeWidth = 1.5);

                  TextPainter(
                    text: TextSpan(
                      text: ' ${String.fromCharCode(65 + (i % 26))}',
                      style: const TextStyle(color: Colors.white, fontSize: 13, fontWeight: FontWeight.bold),
                    ),
                    textDirection: TextDirection.ltr,
                  )..layout()..paint(canvas, points[i] + const Offset(8, -12));

                  if (i > 0) path.lineTo(points[i].dx, points[i].dy);
                }
                if (points.length >= 3) {
                  path.close();
                  canvas.drawPath(path, boundaryPaint);
                  canvas.drawPath(path, Paint()..color = Colors.tealAccent.withOpacity(0.08)..style = PaintingStyle.fill);
                }
              }

              if (centroid != null) {
                canvas.drawCircle(centroid!, 8, centroidPaint);
                canvas.drawCircle(centroid!, 20, Paint()..color = Colors.redAccent.withOpacity(0.25)..style = PaintingStyle.stroke..strokeWidth = 2);

                TextPainter(
                  text: const TextSpan(
                    text: ' Brahmasthan',
                    style: TextStyle(color: Colors.redAccent, fontSize: 11, fontWeight: FontWeight.bold),
                  ),
                  textDirection: TextDirection.ltr,
                )..layout()..paint(canvas, centroid! + const Offset(12, 4));

                double radius = 175.0;
                List<String> activeLabels;
                if (division == 4) activeLabels = dir4;
                else if (division == 8) activeLabels = dir8;
                else if (division == 32) activeLabels = dir32;
                else activeLabels = dir16;

                double step = 360.0 / activeLabels.length;
                double offsetRad = (northDegree - 90) * (math.pi / 180.0);

                for (int i = 0; i < activeLabels.length; i++) {
                  double angle = (i * step) * (math.pi / 180.0) + offsetRad;
                  Offset endPoint = Offset(
                    centroid!.dx + radius * math.cos(angle),
                    centroid!.dy + radius * math.sin(angle),
                  );

                  canvas.drawLine(
                    centroid!,
                    endPoint,
                    Paint()..color = Colors.amberAccent.withOpacity(0.4)..strokeWidth = 1.0,
                  );

                  Offset textPos = Offset(
                    centroid!.dx + (radius + 15) * math.cos(angle),
                    centroid!.dy + (radius + 15) * math.sin(angle),
                  );

                  TextPainter tp = TextPainter(
                    text: TextSpan(
                      text: activeLabels[i],
                      style: TextStyle(
                        color: activeLabels[i].contains('N') ? Colors.greenAccent : (activeLabels[i].contains('S') ? Colors.redAccent : Colors.amberAccent),
                        fontSize: division == 32 ? 9 : 11,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    textDirection: TextDirection.ltr,
                  )..layout();
                  tp.paint(canvas, textPos - Offset(tp.width / 2, tp.height / 2));
                }

                if (showDevtas) {
                  double devtaRadius = radius * 0.72;
                  double devtaStep = 360.0 / devtas45.length;
                  for (int d = 0; d < devtas45.length; d++) {
                    double devtaAngle = (d * devtaStep) * (math.pi / 180.0) + offsetRad;
                    Offset devtaPos = Offset(
                      centroid!.dx + devtaRadius * math.cos(devtaAngle),
                      centroid!.dy + devtaRadius * math.sin(devtaAngle),
                    );

                    TextPainter(
                      text: TextSpan(
                        text: devtas45[d],
                        style: const TextStyle(color: Colors.orangeAccent, fontSize: 8, fontWeight: FontWeight.bold),
                      ),
                      textDirection: TextDirection.ltr,
                    )..layout()..paint(canvas, devtaPos - const Offset(12, 4));
                  }
                }
              }
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }
          EOF

      - name: Force Update Android Manifest with Permissions
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.astro.vastuchakra">
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
             <application
                  android:label="Vastu Chakra Pro"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        run: |
          mkdir -p artifact_dir
          cp build/app/outputs/flutter-apk/app-release.apk artifact_dir/Vastu-Chakra-Pro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vastu-Chakra-Pro
          path: artifact_dir/Vastu-Chakra-Pro.apk
